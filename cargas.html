<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroConecta · Cargas Disponibles</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <img class="tb-logo" src="img/logo-claro.svg" alt="AgroConecta" width="38" height="38">
        <div><h1>Cargas Disponibles</h1><p>Sarmientos publicados por viñateros</p></div>
      </div>
      <div class="content">
        <input class="input" id="q" placeholder="🔍  Buscar por viñatero o comuna…">
        <div class="field-row" style="margin-top:12px;align-items:flex-end">
          <div class="field" style="flex:1;margin-bottom:0">
            <label>Comuna</label>
            <select id="comuna"><option value="">Todas las comunas</option></select>
          </div>
          <div class="field" style="flex:1;margin-bottom:0">
            <label>Volumen mínimo (m³)</label>
            <input class="input" id="vmin" type="number" min="0" placeholder="Sin mínimo">
          </div>
        </div>
        <div class="chip-select" id="filtros" style="margin-top:14px"></div>
        <div id="results" class="stagger" style="margin-top:16px"></div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomnav"></nav>

  <script src="js/config.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vivo.js"></script>
  <script src="js/ruteo.js"></script>
  <script src="js/mosaico.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/soporte.js"></script>
  <script src="js/shell.js"></script>
  <script>
    Shell.init('cargas', { rol: Store.ROL_EMPRESA }).then(listo => { if (!listo) return;
      const $ = id => document.getElementById(id);

      // Comunas presentes en las cargas, sin repetir.
      const comunas = [...new Set(Store.cargasPublicadas().map(c => c.comuna))].sort();
      $('comuna').innerHTML += comunas.map(c => `<option>${c}</option>`).join('');

      let filtro = 'Todos';
      const filtros = ['Todos', 'Biomasa', 'Compostaje', 'Indistinto'];
      $('filtros').innerHTML = filtros.map(f =>
        `<button class="chip ${f === filtro ? 'active' : ''}" data-f="${f}">${f === 'Todos' ? '' : tipoIcono(f) + ' '}${f}</button>`).join('');
      $('filtros').querySelectorAll('.chip').forEach(b => {
        b.onclick = () => {
          filtro = b.dataset.f;
          $('filtros').querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.f === filtro));
          render();
        };
      });

      /* Una carga suelta dentro de la tarjeta de su productor. El índice es
         el de la lista completa, para que los botones sigan encontrándola. */
      function filaCarga(c, i) {
        const color = tipoColor(c.destino);
        const dist = c.km ? ` · ${c.km} km` : '';
        return `
          <div class="carga-fila">
            <div class="li-ic" style="background:${Shell.tinte(color)};color:${color}">${tipoIcono(c.destino)}</div>
            <div class="carga-datos">
              <div class="carga-titulo">
                <b>${c.volumen} m³</b> · ${Shell.escape(c.comuna)}${dist}
                ${Shell.badge(c.destino, color)}
              </div>
              <div class="li-sub">📅 Disponible: ${Shell.escape(c.fecha || 'Por confirmar')}</div>
              ${c.notas ? `<div class="li-sub">📝 ${Shell.escape(c.notas)}</div>` : ''}
            </div>
            <button class="btn" style="padding:10px 14px;font-size:13.5px" data-retiro="${i}">🚚 Programar</button>
          </div>`;
      }

      /* Tarjeta de un productor con todo lo que ofrece. Si solo tiene una
         carga se ve igual que antes; la diferencia aparece cuando tiene
         varias, que es cuando antes se repetía la misma cabecera. */
      function tarjetaGrupo(g, indices) {
        const varias = g.cargas.length > 1;
        return `
          <div class="card pad route-card">
            <div class="grupo-cabecera">
              <div class="li-ic" style="background:rgba(46,125,50,.12);color:var(--primary)">🍇</div>
              <div class="grupo-titulo">
                <b>${Shell.escape(g.productor)}</b>
                <span class="li-sub">
                  ${varias ? `${g.cargas.length} cargas · ` : ''}${g.volumen} m³ en total
                  · ${g.comunas.map(Shell.escape).join(', ')}
                </span>
              </div>
              <button class="btn ghost" style="padding:10px 14px;font-size:13.5px"
                      data-i="${indices[0]}">📞 Contactar</button>
            </div>
            <div class="grupo-cargas">
              ${g.cargas.map((c, k) => filaCarga(c, indices[k])).join('')}
            </div>
          </div>`;
      }

      function render() {
        const q = $('q').value.trim().toLowerCase();
        const comuna = $('comuna').value;
        const vmin = parseFloat($('vmin').value) || 0;

        const lista = Store.cargasPublicadas().filter(c => {
          const okTexto = !q || c.productor.toLowerCase().includes(q) || c.comuna.toLowerCase().includes(q);
          const okComuna = !comuna || c.comuna === comuna;
          const okDestino = filtro === 'Todos' || c.destino === filtro;
          const okVolumen = c.volumen >= vmin;
          return okTexto && okComuna && okDestino && okVolumen;
        });

        const box = $('results');
        if (lista.length === 0) {
          box.innerHTML = `<div class="empty"><div class="ic">🌾</div><p>No hay cargas que coincidan con los filtros</p></div>`;
          return;
        }

        const total = lista.reduce((s, c) => s + c.volumen, 0);

        /* Se agrupa por productor, pero los botones siguen apuntando a la
           posición de cada carga en "lista": así el resto del código que
           lee data-i y data-retiro no cambia. */
        const grupos = Shell.agruparPorProductor(lista);
        const posicion = new Map(lista.map((c, i) => [c, i]));

        box.innerHTML =
          `<div class="section-sub" style="margin-bottom:10px">
             ${lista.length} carga(s) de ${grupos.length} productor(es) · ${total} m³ en total
           </div>` +
          `<div class="grid">`
          + grupos.map(g => tarjetaGrupo(g, g.cargas.map(c => posicion.get(c)))).join('')
          + `</div>`;

        // Contacto directo con el productor de cada carga.
        box.querySelectorAll('button[data-i]').forEach(b => {
          b.onclick = () => {
            const c = lista[+b.dataset.i];
            Shell.contactar(c.productor, `${c.comuna} · ${c.volumen} m³ de sarmientos`, {
              tel: c.telefono, email: c.email, ic: '🍇',
            });
          };
        });

        // Programar el retiro: crea el envío y abre su seguimiento.
        box.querySelectorAll('button[data-retiro]').forEach(b => {
          b.onclick = () => programarRetiro(lista[+b.dataset.retiro]);
        });

        box.classList.remove('stagger'); void box.offsetWidth; box.classList.add('stagger');
      }

      /* Programa el retiro de una carga: pide el transportista y crea el envío,
         que desde ese momento el viñatero puede seguir en el mapa. */
      function programarRetiro(carga) {
        const u = Store.currentUser();
        const origen = Shell.coordComuna(carga.comuna);
        const base = Shell.ubicacionCuenta();
        if (!origen) { Shell.toast('No tenemos las coordenadas de esa comuna'); return; }

        const km = base ? Shell.distanciaKm(origen, base) : 40;
        const minutos = Math.max(6, Math.round(km * 1.4));

        // Transportistas vinculados a esta planta: a ellos se les puede
        // encargar el retiro directamente, sin escribir nada a mano.
        const flota = Store.miFlota();

        /* Quién puede hacer la estiba: transportistas que declararon el
           servicio de cargador en su perfil. La administración deriva a uno
           de ellos cuando la viña pidió cargadores. */
        const estibas = Store.cuadrillasDisponibles()
          .sort((a, b) => Store.personasDeEstiba(b) - Store.personasDeEstiba(a));

        Shell.openModal(`
          <div class="handle"></div>
          <b style="font-size:18px">Programar retiro</b>
          <p class="section-sub" style="margin-top:4px">
            ${Shell.escape(carga.productor)} · ${carga.volumen} m³ en ${Shell.escape(carga.comuna)}
          </p>
          <div class="field" style="margin-top:16px">
            <label for="r-flota">Transportista a cargo</label>
            <select id="r-flota">
              ${flota.map(f => `<option value="${Shell.escape(f.email)}">${
                Shell.escape(f.nombre)}${f.patente ? ' · ' + Shell.escape(f.patente) : ''}${
                f.disponible === false ? ' (no disponible)' : ''}</option>`).join('')}
              <option value="">Otro transportista (escribir los datos)</option>
            </select>
            <div class="section-sub" style="margin-top:6px">
              ${flota.length
                ? 'Le llegará el encargo a su perfil y decide si lo toma.'
                : 'Todavía no tienes transportistas vinculados: cada uno se vincula desde su propio perfil, en Ajustes.'}
            </div>
          </div>
          ${carga.manoObra === 'solicita' ? `
            <div class="field">
              <label for="r-estiba">Cargadores para esta viña</label>
              <select id="r-estiba">
                ${estibas.map(e => `<option value="${Shell.escape(e.email)}">${
                  Shell.escape(Store.nombreDeEstiba(e))} · ${Store.personasDeEstiba(e)} persona(s)${
                  e.comuna ? ' · ' + Shell.escape(e.comuna) : ''}</option>`).join('')}
                <option value="">Sin cuadrilla (lo resuelve el transportista)</option>
              </select>
              <div class="section-sub" style="margin-top:6px">
                🙋 Esta viña pidió cargadores. ${estibas.length
                  ? 'Elige a quién deriva la administración.'
                  : 'Nadie ofrece el servicio ahora mismo.'}
              </div>
            </div>` : ''}

          <div class="field" id="r-manual" style="display:none">
            <label for="r-chofer">Nombre del transportista</label>
            <input class="input" id="r-chofer" placeholder="Nombre del transportista">
            <label for="r-tel" style="margin-top:10px">Teléfono</label>
            <input class="input" id="r-tel" type="tel" inputmode="tel" placeholder="+56 9 ...">
            <label for="r-patente" style="margin-top:10px">Patente (opcional)</label>
            <input class="input" id="r-patente" placeholder="Ej: KDJS-42">
          </div>
          <div class="field">
            <label for="r-min">Tiempo estimado de viaje (minutos)</label>
            <input class="input" id="r-min" type="number" min="1" value="${minutos}" inputmode="numeric">
            <div class="section-sub" style="margin-top:6px">
              ${km} km hasta ${Shell.escape(base ? base.comuna : 'tu base')}
            </div>
          </div>
          <div class="card pad" id="r-cobro" style="background:var(--surface-alt);margin-bottom:14px"></div>
          <div class="err" id="r-err"></div>
          <div class="field-row">
            <button class="btn ghost" style="flex:1" onclick="Shell.closeModal()">Cancelar</button>
            <button class="btn" style="flex:1" id="r-ok">🚚 Iniciar retiro</button>
          </div>`);

        /* Lo que cuesta el flete y cómo se reparte. Se recalcula al
           cambiar la cuadrilla, porque la estiba entra o sale del cobro. */
        function pintarCobro() {
          const sel = $('r-estiba');
          const hayEstiba = carga.manoObra === 'solicita' && !!(sel && sel.value);
          const tarifa = Finanzas.tarifa({ km, volumen: carga.volumen, vinatero: Store.accountByEmail(carga.email) });
          const total = Finanzas.cobrado(tarifa, hayEstiba);
          const elegidoChofer = $('r-flota').value;
          const propia = hayEstiba && sel.value === elegidoChofer;
          const r = Finanzas.reparto(total, { conEstiba: hayEstiba, estibaDelChofer: propia });

          $('r-cobro').innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <b>Flete</b>
              <b style="font-size:20px">${Finanzas.pesos(total)}</b>
            </div>
            <div class="li-sub" style="margin-top:4px">
              ${km} km · ${carga.volumen} m³${hayEstiba ? ' · con estiba' : ' · sin estiba (la viña pone su gente)'}
            </div>
            <div style="margin-top:10px;display:grid;gap:4px">
              <div class="li-sub">🚚 Transportista: <b>${Finanzas.pesos(r.transporte)}</b></div>
              ${r.estiba > 0 ? `<div class="li-sub">💪 Estiba: <b>${Finanzas.pesos(r.estiba)}</b></div>` : ''}
              <div class="li-sub">🛟 Fondo de imprevistos: ${Finanzas.pesos(r.reserva)}</div>
              <div class="li-sub">⚙️ Plataforma: ${Finanzas.pesos(r.app)}</div>
            </div>
            <div class="li-sub" style="margin-top:10px">
              🔒 El monto queda <b>retenido en custodia</b> y se libera cuando valides la descarga.
            </div>
            <div class="li-sub" style="margin-top:6px;opacity:.75">
              Simulación: la aplicación no cobra ni transfiere dinero real.
            </div>`;
        }

        $('r-flota').onchange = () => {
          $('r-manual').style.display = $('r-flota').value ? 'none' : 'block';
          pintarCobro();
        };
        $('r-flota').onchange();
        if ($('r-estiba')) $('r-estiba').onchange = pintarCobro;
        pintarCobro();

        $('r-ok').onclick = async () => {
          const min = parseInt($('r-min').value, 10);
          const elegido = $('r-flota').value
            ? Store.accountByEmail($('r-flota').value) : null;

          // Con un transportista vinculado los datos salen de su perfil; si no,
          // se escriben a mano y el viaje queda sin seguimiento por GPS.
          const chofer = elegido ? elegido.nombre : $('r-chofer').value.trim();
          const tel = elegido ? (elegido.telefono || '') : $('r-tel').value.trim();
          const patente = elegido ? (elegido.patente || '') : $('r-patente').value.trim();

          if (!chofer) return ($('r-err').textContent = 'Escribe el nombre del transportista.');
          if (!tel) return ($('r-err').textContent = 'Escribe el teléfono del transportista.');
          if (!min || min < 1) return ($('r-err').textContent = 'Ingresa un tiempo válido.');

          // A quién derivó la administración para cargar, si aplica.
          const campoEstiba = $('r-estiba');
          const estiba = (campoEstiba && campoEstiba.value)
            ? Store.accountByEmail(campoEstiba.value) : null;

          $('r-ok').disabled = true;
          const destino = base && base.lat ? base : origen;
          let envio;
          try {
            envio = await Store.addEnvio({
              id: 'env-' + Date.now(),
              cargaId: carga.id || null,
              vinateroEmail: carga.email || null,
              empresaEmail: Store.currentEmail(),
              choferEmail: elegido ? elegido.email : null,
              chofer, choferTelefono: tel, patente,
              cuadrillaEmail: estiba ? estiba.email : '',
              cuadrillaNombre: estiba ? Store.nombreDeEstiba(estiba) : '',
              origenComuna: carga.comuna, origenLat: origen.lat, origenLng: origen.lng,
              destinoId: null, destinoNombre: u.nombre,
              destinoLat: destino.lat, destinoLng: destino.lng,
              // Si hay transportista vinculado, el viaje espera a que lo acepte.
              estado: elegido ? 'asignado' : 'en_camino',
              salida: elegido ? null : new Date().toISOString(),
              minutosTotal: min,
              progreso: 0, vehLat: null, vehLng: null,
              volumenDeclarado: carga.volumen,
              volumenRecibido: null, pesoRecibido: null, observaciones: '',
              creado: new Date().toISOString(),
            });
          } catch (e) {
            $('r-ok').disabled = false;
            return ($('r-err').textContent = 'No se pudo programar el retiro: ' + e.message);
          }

          /* El flete queda retenido: ni la planta lo tiene ni el
             transportista puede cobrarlo hasta que se valide la descarga. */
          const hayEstiba = carga.manoObra === 'solicita' && !!estiba;
          await Store.retenerFlete(
            envio.id, Finanzas.tarifa({ km, volumen: carga.volumen, vinatero: Store.accountByEmail(carga.email) }), hayEstiba);

          Shell.closeModal();
          if (elegido) {
            Shell.toast(`Encargo enviado a ${elegido.nombre}`
              + (estiba ? ` · Estiba: ${Store.nombreDeEstiba(estiba)}` : ''));
          }
          location.href = 'seguimiento.html?id=' + encodeURIComponent(envio.id);
        };
      }

      $('q').oninput = render;
      $('comuna').onchange = render;
      $('vmin').oninput = render;
      render();

      /* Las cargas nuevas entran solas en el listado. */
      Shell.enVivo(['cargas', 'envios'], render);
    });
  </script>
</body>
</html>
