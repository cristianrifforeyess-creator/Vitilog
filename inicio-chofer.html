<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroConecta · Servicios</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <img class="tb-logo" src="img/logo-claro.svg" alt="AgroConecta" width="38" height="38">
        <div><h1>Servicios disponibles</h1><p id="tb-sub">Región del Maule</p></div>
        <div class="tb-actions">
          <button title="Buscar servicios nuevos" id="btn-refrescar" aria-label="Actualizar">🔄</button>
          <button title="Ajustes" onclick="location.href='configuracion.html'" aria-label="Ajustes">⚙️</button>
        </div>
      </div>
      <div class="content">
        <!-- Lo que este transportista lleva trasladado. -->
        <div id="aporte-inicio"></div>
        <div class="stagger" id="content"></div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomnav"></nav>

  <script src="js/config.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vivo.js"></script>
  <script src="js/ruteo.js"></script>
  <script src="js/mosaico.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/soporte.js"></script>
  <script src="js/shell.js"></script>
  <script>
    Shell.init('inicio', { rol: Store.ROL_CHOFER }).then(listo => { if (!listo) return;
      const $ = id => document.getElementById(id);
      const c = $('content');
      const u = Store.currentUser();
      const base = Shell.ubicacionCuenta();

      let vistos = new Set();     // para avisar solo de las cargas nuevas
      let vistosEnvios = new Set();  // lo mismo para los retiros encargados

      function render() {
        /* El cargador individual no conduce: su panel no muestra cargas
           para tomar ni viajes, sino las estibas que le derivaron. */
        if (Store.esSoloCargador(u)) return renderCargador();

        const activo = Store.servicioActivo();
        const asignados = Store.serviciosAsignados();
        const cargas = Store.cargasDisponibles(base);
        const hechos = Store.misServicios().filter(e => e.estado === 'entregado');

        /* Versión corta de la modalidad para el encabezado. Se cambia en
           Ajustes, dentro del propio perfil. */
        const quien = (u.modalidad === 'empresa' && (u.empresa_nombre || '').trim())
          ? u.empresa_nombre.trim()
          : u.modalidad === 'cargador' ? 'Cargador individual' : 'Independiente';
        $('tb-sub').textContent = base
          ? `${quien} · Base en ${base.comuna}${u.patente ? ' · ' + u.patente : ''}`
          : 'Elige tu comuna en Ajustes';

        c.innerHTML = `
          ${Shell.avisoPerfil()}
          ${activo ? tarjetaActivo(activo) : ''}

          ${asignados.length ? `
            <div class="section" ${activo ? '' : 'style="margin-top:4px"'}>
              <div class="section-title">Retiros que te encargaron</div>
              <div class="section-sub">Acepta para empezar el viaje y encender el GPS</div>
            </div>
            <div class="grid" style="margin-top:12px">
              ${asignados.map(tarjetaAsignado).join('')}
            </div>` : ''}

          <div class="section">
            <div class="section-title">Mis ganancias</div>
            <div class="section-sub">Lo que has ganado por transporte y estiba</div>
            <div style="margin-top:12px">${Finanzas.walletHtml(u.email, { titulo: 'Ganancias acumuladas' })}</div>
          </div>

          <div class="section">
            <div class="section-title">Cargas esperando retiro</div>
            <div class="section-sub">
              ${cargas.length === 0 ? 'Ninguna por ahora' :
                `${cargas.length} disponible(s) de ${Shell.agruparPorProductor(cargas).length} productor(es)${
                  base ? ', de la más cercana a la más lejana' : ''}`}
            </div>
          </div>

          ${cargas.length === 0
            ? `<div class="empty">
                 <div class="ic">📋</div>
                 <p>No hay cargas publicadas en este momento.</p>
                 <p style="font-size:13px">Cuando un viñatero publique una, aparecerá acá y te avisaremos.</p>
               </div>`
            : `<div class="grid" style="margin-top:12px">${
                Shell.agruparPorProductor(cargas)
                  .map(g => tarjetaGrupo(g, g.cargas.map(x => cargas.indexOf(x))))
                  .join('')}</div>`}

          ${hechos.length ? `
            <div class="section">
              <div class="section-title">Servicios completados</div>
              <div class="section-sub">${hechos.length} entrega(s)</div>
            </div>
            <div class="grid" style="margin-top:12px">
              ${hechos.map(e => `
                <div class="card list-item" style="cursor:pointer" data-ver="${e.id}">
                  <div class="li-ic" style="background:rgba(46,125,50,.13);color:var(--primary)">✅</div>
                  <div class="li-body">
                    <div class="li-title">${Shell.escape(e.origenComuna)} → ${Shell.escape(e.destinoNombre)}</div>
                    <div class="li-sub">${e.volumenRecibido ?? e.volumenDeclarado} m³ entregados</div>
                  </div>
                  <div class="li-chev">›</div>
                </div>`).join('')}
            </div>` : ''}`;

        conectar(cargas);
      }

      /* Pide el GPS y, si no se puede, acompaña al chofer en vez de
         dejarlo encerrado.

         El muro anterior solo decía "busca el candado de la barra de
         direcciones", que en un iPhone no existe, y no ofrecía ni
         reintentar ni salida. Un chofer parado en la viña con el camión
         esperando no puede quedarse ahí.

         Por eso ahora hay tres caminos: arreglarlo con instrucciones de
         su propio aparato, reintentar, o seguir sin GPS asumiendo que el
         viñatero no lo verá en el mapa. */
      async function conGPS(seguir) {
        const gps = await Shell.exigirGPS();
        if (gps.ok) return seguir(true);
        avisoSinGPS(gps.causa, seguir);
      }

      function avisoSinGPS(causa, seguir) {
        const g = Shell.pasosGPS(causa);
        Shell.openModal(`
          <div class="handle"></div>
          <div style="text-align:center;padding:6px 0 2px">
            <div style="font-size:42px">📡</div>
            <b style="font-size:19px;display:block;margin-top:8px">${Shell.escape(g.titulo)}</b>
          </div>

          <ol class="pasos-gps">
            ${g.pasos.map(p => `<li>${Shell.escape(p)}</li>`).join('')}
          </ol>

          <button class="btn block" id="gps-reintentar" style="min-height:54px">
            🔄 Reintentar
          </button>

          ${Soporte && Soporte.hayCanal() ? `
            <button class="btn ghost block" style="margin-top:10px" id="gps-ayuda">
              🎧 Servicio al cliente
            </button>` : ''}

          <div class="card pad" style="background:var(--surface-alt);margin-top:16px">
            <div class="li-sub">
              Si no logras encenderlo y el camión tiene que salir igual, puedes
              seguir sin GPS. El viñatero no verá tu recorrido en el mapa:
              avísale por teléfono.
            </div>
            <button class="btn ghost block" style="margin-top:12px" id="gps-seguir">
              Continuar sin GPS
            </button>
          </div>

          <button class="btn ghost block" style="margin-top:10px"
                  onclick="Shell.closeModal()">Cancelar</button>`);

        document.getElementById('gps-reintentar').onclick = () => {
          Shell.closeModal();
          conGPS(seguir);
        };
        const ayuda = document.getElementById('gps-ayuda');
        if (ayuda) ayuda.onclick = () => { Shell.closeModal(); Soporte.abrir(); };
        document.getElementById('gps-seguir').onclick = () => {
          Shell.closeModal();
          Shell.toast('Viaje sin seguimiento en vivo');
          seguir(false);
        };
      }

      /* Retiro que una planta le encargó a este transportista y que todavía
         no responde. Es lo primero que tiene que decidir. */
      function tarjetaAsignado(envio) {
        const planta = Store.accountByEmail(envio.empresaEmail);
        const km = Shell.distanciaKm(
          { lat: envio.origenLat, lng: envio.origenLng },
          { lat: envio.destinoLat, lng: envio.destinoLng });
        return `
          <div class="card pad" style="border:2px dashed var(--warning)">
            <div class="list-item" style="padding:0">
              <div class="li-ic" style="background:rgba(249,168,37,.15);color:var(--warning)">📨</div>
              <div class="li-body">
                <div class="li-title">${Shell.escape(envio.origenComuna)} → ${Shell.escape(envio.destinoNombre)}</div>
                <div class="li-sub">
                  ${envio.volumenDeclarado} m³${km != null ? ' · ' + km + ' km' : ''}${
                    envio.minutosTotal ? ' · ~' + envio.minutosTotal + ' min' : ''}
                </div>
                <div class="li-sub">Te lo encargó ${Shell.escape(planta ? planta.nombre : 'la planta receptora')}</div>
              </div>
            </div>
            <div class="field-row" style="margin-top:14px">
              <button class="btn ghost" style="flex:1" data-rechazar-envio="${Shell.escape(envio.id)}">No puedo</button>
              <button class="btn" style="flex:1" data-aceptar-envio="${Shell.escape(envio.id)}">✅ Aceptar</button>
            </div>
          </div>`;
      }

      /* Viaje en curso: ocupa el primer lugar, es lo único que importa. */
      function tarjetaActivo(envio) {
        const seg = Shell.calcularSeguimiento(envio);
        const est = estadoEnvio(seg.estado);
        const sinLeer = Store.mensajesNoLeidos(envio.id).length;
        return `
          <div class="card pad" style="border:2px solid ${est.color}">
            <div class="envio-cabecera">
              <div class="li-ic" style="background:${est.color}22;color:${est.color};width:46px;height:46px;font-size:23px">${est.ic}</div>
              <div class="titulo">
                Viaje en curso
                <div class="li-sub" style="font-weight:400">
                  ${Shell.escape(envio.origenComuna)} → ${Shell.escape(envio.destinoNombre)}
                </div>
              </div>
              ${Shell.badge(est.label, est.color)}
            </div>
            <div class="progress" style="margin-top:12px">
              <div style="width:${Math.round(seg.progreso*100)}%;background:${est.color}"></div>
            </div>
            <button class="btn block" style="margin-top:14px" onclick="location.href='viaje.html'">
              🚚 Abrir mi viaje${sinLeer ? ' · 💬 ' + sinLeer : ''}
            </button>
          </div>`;
      }

      /* Una carga que se puede aceptar. */
      /* Panel del que solo carga. No elige trabajos: se los asigna la
         administración junto con la ruta y el chofer al que asiste. */
      function renderCargador() {
        const mias = Store.misEstibas();
        const pendientes = mias.filter(e => e.estado !== 'entregado');
        const hechas = mias.filter(e => e.estado === 'entregado');

        $('tb-sub').textContent =
          `${Store.nombreDeEstiba(u) || u.nombre} · ${Store.personasDeEstiba(u)} persona(s)`
          + (u.comuna ? ' · ' + u.comuna : '');

        c.innerHTML = `
          ${Shell.avisoPerfil()}

          <div class="section" style="margin-top:4px">
            <div class="section-title">Estibas que te asignaron</div>
            <div class="section-sub">
              ${pendientes.length === 0
                ? 'Ninguna por ahora'
                : `${pendientes.length} viña(s) esperando carga`}
            </div>
          </div>

          ${pendientes.length === 0
            ? `<div class="empty">
                 <div class="ic">💪</div>
                 <p>No tienes estibas asignadas.</p>
                 <p style="font-size:13px">
                   La administración de AgroConecta te deriva a los retiros que
                   necesitan cargadores, con la ruta y el chofer al que asistes.
                 </p>
               </div>`
            : `<div class="grid" style="margin-top:12px">
                 ${pendientes.map(tarjetaEstiba).join('')}
               </div>`}

          ${hechas.length ? `
            <div class="section">
              <div class="section-title">Estibas completadas</div>
              <div class="section-sub">${hechas.length} trabajo(s)</div>
            </div>
            <div class="grid" style="margin-top:12px">
              ${hechas.map(e => `
                <div class="card list-item">
                  <div class="li-ic" style="background:rgba(46,125,50,.13);color:var(--primary)">✅</div>
                  <div class="li-body">
                    <div class="li-title">${Shell.escape(e.origenComuna)} → ${Shell.escape(e.destinoNombre)}</div>
                    <div class="li-sub">${e.volumenRecibido ?? e.volumenDeclarado} m³ cargados</div>
                  </div>
                </div>`).join('')}
            </div>` : ''}`;

        c.querySelectorAll('[data-ver-estiba]').forEach(b => {
          b.onclick = () => {
            location.href = 'seguimiento.html?id=' + encodeURIComponent(b.dataset.verEstiba);
          };
        });
        c.querySelectorAll('[data-llamar-chofer]').forEach(b => {
          b.onclick = () => {
            const e = Store.envioPorId(b.dataset.llamarChofer);
            if (!e) return;
            Shell.contactar(e.chofer || 'Transportista',
              `${e.origenComuna} → ${e.destinoNombre}`,
              { tel: e.choferTelefono, email: e.choferEmail, ic: '🚚' });
          };
        });
      }

      /* Un trabajo de estiba: dónde, cuánto y a quién asiste. */
      function tarjetaEstiba(envio) {
        const est = estadoEnvio(Shell.calcularSeguimiento(envio).estado);
        const volumen = (Number(envio.volumenDeclarado) || 0)
          + (envio.paradas || []).reduce((t, p) => t + (Number(p.volumen) || 0), 0);
        return `
          <div class="card pad" style="border-left:4px solid ${est.color}">
            <div class="list-item" style="padding:0">
              <div class="li-ic" style="background:${est.color}22;color:${est.color}">💪</div>
              <div class="li-body">
                <div class="li-title">${Shell.escape(envio.origenComuna)}</div>
                <div class="li-sub">${volumen} m³ para subir · hacia ${Shell.escape(envio.destinoNombre)}</div>
                <div class="li-sub">🚚 Asistes a ${Shell.escape(envio.chofer || 'un transportista')}</div>
              </div>
              ${Shell.badge(est.label, est.color)}
            </div>
            <div class="field-row" style="margin-top:14px">
              <button class="btn ghost" style="flex:1" data-llamar-chofer="${Shell.escape(envio.id)}">📞 Transportista</button>
              <button class="btn" style="flex:1" data-ver-estiba="${Shell.escape(envio.id)}">Ver retiro</button>
            </div>
          </div>`;
      }

      /* ¿Le sirve esta carga a su camión? El aviso no bloquea: el que
         conoce el campo puede saber que sí entra, y decidir él. */
      function compat(carga) {
        return Store.compatibilidad(carga, u.vehiculo);
      }

      /* Quién cargaría el camión si esta carga pide cuadrilla. */
      function cuadrillaPara(carga) {
        return Store.asignarCuadrilla(carga, u);
      }

      /* Una carga dentro de la tarjeta de su productor. */
      function filaCarga(carga, i) {
        const color = tipoColor(carga.destino);
        return `
          <div class="carga-fila">
            <div class="li-ic" style="background:${color}22;color:${color}">${tipoIcono(carga.destino)}</div>
            <div class="carga-datos">
              <div class="carga-titulo">
                <b>${carga.volumen} m³</b> · ${Shell.escape(carga.comuna)}
                ${carga.km != null ? Shell.badge('a ' + carga.km + ' km', '#1976D2', '📍') : ''}
              </div>
              <div class="li-sub">♻️ ${Shell.escape(carga.destino)} · 📅 ${Shell.escape(carga.fecha || 'Por confirmar')}</div>
              ${carga.manoObra === 'solicita'
                ? `<div class="li-sub">🙋 Pide cuadrilla${cuadrillaPara(carga) ? ' · ' + Shell.escape(cuadrillaPara(carga).nombre) : ': no hay disponible'}</div>`
                : ''}
              ${carga.notas ? `<div class="li-sub">📝 ${Shell.escape(carga.notas)}</div>` : ''}
              ${compat(carga).puede ? '' :
                `<div class="li-sub" style="color:var(--warning)">⚠️ ${Shell.escape(compat(carga).motivo)}</div>`}
            </div>
            <button class="btn ${compat(carga).puede ? '' : 'ghost'}"
                    style="padding:10px 14px;font-size:13.5px" data-aceptar="${i}">✋ Aceptar</button>
          </div>`;
      }

      /* Todo lo que ofrece un mismo productor, junto. Para el transportista
         importa el doble que para la planta: varias cargas del mismo sitio
         son un solo desvío, y eso se ve de una mirada. */
      function tarjetaGrupo(g, indices) {
        const varias = g.cargas.length > 1;
        return `
          <div class="card pad route-card">
            <div class="grupo-cabecera">
              <div class="li-ic" style="background:rgba(46,125,50,.12);color:var(--primary)">🍇</div>
              <div class="grupo-titulo">
                <b>${Shell.escape(g.productor)}</b>
                <span class="li-sub">
                  ${varias ? `${g.cargas.length} cargas · ` : ''}${g.volumen} m³ en total
                  · ${g.comunas.map(Shell.escape).join(', ')}
                  ${g.km != null ? ` · desde ${g.km} km` : ''}
                </span>
              </div>
              <button class="btn ghost" style="padding:10px 14px;font-size:13.5px"
                      data-llamar="${indices[0]}">📞 Productor</button>
            </div>
            <div class="grupo-cargas">
              ${g.cargas.map((x, k) => filaCarga(x, indices[k])).join('')}
            </div>
          </div>`;
      }

      function conectar(cargas) {
        c.querySelectorAll('[data-llamar]').forEach(b => {
          b.onclick = () => {
            const g = cargas[+b.dataset.llamar];
            Shell.contactar(g.productor, `${g.comuna} · ${g.volumen} m³`,
              { tel: g.telefono, email: g.email, ic: '🍇' });
          };
        });
        c.querySelectorAll('[data-aceptar]').forEach(b => {
          b.onclick = () => aceptar(cargas[+b.dataset.aceptar]);
        });
        c.querySelectorAll('[data-ver]').forEach(el => {
          el.onclick = () => location.href = 'seguimiento.html?id=' + encodeURIComponent(el.dataset.ver);
        });

        /* Retiros encargados por una planta: aceptar arranca el viaje y lleva
           directo a la pantalla donde se enciende el GPS. */
        c.querySelectorAll('[data-aceptar-envio]').forEach(b => {
          b.onclick = async () => {
            if (Store.servicioActivo()) {
              return Shell.toast('Primero cierra el viaje que tienes en curso');
            }
            b.disabled = true;
            const id = b.dataset.aceptarEnvio;

            conGPS(async hayGps => {
              const error = await Store.aceptarServicio(id);
              if (error) { b.disabled = false; return Shell.toast(error); }
              // El "1" le dice a la pantalla del viaje que encienda el GPS sola.
              location.href = hayGps ? 'viaje.html?iniciar=1' : 'viaje.html';
            });
          };
        });
        c.querySelectorAll('[data-rechazar-envio]').forEach(b => {
          b.onclick = async () => {
            b.disabled = true;
            const error = await Store.rechazarServicio(b.dataset.rechazarEnvio);
            if (error) { b.disabled = false; return Shell.toast(error); }
            Shell.toast('Retiro rechazado. La carga queda libre.');
            render();
          };
        });
      }

      /* Aceptar: se elige la planta de destino y se crea el viaje. */
      async function aceptar(carga) {
        if (Store.servicioActivo()) {
          Shell.toast('Ya tienes un viaje en curso. Ciérralo antes de tomar otro.');
          return;
        }
        if (!carga.lat) { Shell.toast('Esa comuna no tiene coordenadas'); return; }

        /* El GPS se pide al confirmar, no acá. Bloquearlo antes de que
           siquiera vea a qué planta iría era pedirle resolver un permiso
           para algo que todavía no sabe si le conviene. */
        let plantas = Shell.empresasParaBuscador()
          .filter(p => p.activo && (carga.destino === 'Indistinto' || p.tipo === carga.destino));
        if (plantas.length === 0) { Shell.toast('No hay plantas con cupos para ese destino'); return; }

        /* Distancias por carretera, no en línea recta: una planta puede verse
           cerca en el mapa y quedar al otro lado del río. Una sola consulta
           para todas, en vez de una por planta. */
        Shell.toast('Calculando distancias reales…');
        const m = await Ruteo.matriz([carga, ...plantas]);
        plantas = plantas
          .map((p, i) => ({
            ...p,
            kmDesdeCarga: m ? m.km[0][i + 1] : Shell.distanciaKm(carga, p),
            minDesdeCarga: m ? m.minutos[0][i + 1] : null,
          }))
          .sort((a, b) => (a.kmDesdeCarga ?? 1e9) - (b.kmDesdeCarga ?? 1e9));
        const porCarretera = !!(m && m.real);

        Shell.openModal(`
          <div class="handle"></div>
          <b style="font-size:18px">Aceptar servicio</b>
          <p class="section-sub" style="margin-top:4px">
            ${carga.volumen} m³ de ${Shell.escape(carga.productor)} en ${Shell.escape(carga.comuna)}
          </p>
          <div class="field" style="margin-top:16px">
            <label for="a-planta">¿Dónde la vas a entregar?</label>
            <select id="a-planta">
              ${plantas.map(p => `<option value="${p.id}">${Shell.escape(p.nombre)} · ${p.comuna} · ${p.kmDesdeCarga} km</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="a-min">Tiempo estimado del viaje (minutos)</label>
            <input class="input" id="a-min" type="number" min="1" inputmode="numeric"
                   value="${plantas[0].minDesdeCarga || Math.max(6, Math.round(plantas[0].kmDesdeCarga * 1.4))}">
            <div class="section-sub" style="margin-top:6px">
              ${porCarretera
                ? '🛣️ Distancias y tiempos por la carretera real, a velocidad de camión cargado.'
                : '📏 El servicio de rutas no respondió: son estimaciones en línea recta.'}
            </div>
          </div>
          ${carga.manoObra === 'solicita' ? `
            <div class="card pad" style="background:var(--surface-alt);margin-bottom:14px">
              <b>🙋 Esta viña pide cuadrilla</b>
              <div class="li-sub" style="margin-top:4px">
                ${cuadrillaPara(carga)
                  ? (cuadrillaPara(carga).propia
                      ? 'La haces tú: quedará anotada como tu estiba.'
                      : 'Se asignará <b>' + Shell.escape(cuadrillaPara(carga).nombre) + '</b>, de la red.')
                  : 'No hay cuadrillas disponibles ahora. Puedes tomarla igual, pero tendrás que resolver la carga.'}
              </div>
            </div>` : ''}
          <div class="err" id="a-err"></div>
          <div class="field-row">
            <button class="btn ghost" style="flex:1" onclick="Shell.closeModal()">Cancelar</button>
            <button class="btn" style="flex:1" id="a-ok">✋ Tomar el servicio</button>
          </div>`);

        // Al cambiar de planta se recalcula el tiempo sugerido.
        $('a-planta').onchange = () => {
          const p = plantas.find(x => x.id === $('a-planta').value);
          if (p) $('a-min').value = p.minDesdeCarga || Math.max(6, Math.round(p.kmDesdeCarga * 1.4));
        };

        $('a-ok').onclick = () => {
          const planta = plantas.find(x => x.id === $('a-planta').value);
          const min = parseInt($('a-min').value, 10);
          if (!planta) return ($('a-err').textContent = 'Elige la planta de destino.');
          if (!min || min < 1) return ($('a-err').textContent = 'Ingresa un tiempo válido.');

          // Recién acá se pide la ubicación: ya decidió que toma el servicio.
          Shell.closeModal();
          conGPS(hayGps => tomarServicio(carga, planta, min, hayGps));
        };
      }

      async function tomarServicio(carga, planta, min, hayGps) {
        {
          const cuadrilla = cuadrillaPara(carga);
          const envio = await Store.addEnvio({
            id: 'env-' + Date.now(),
            cargaId: carga.id || null,
            vinateroEmail: carga.email || null,
            empresaEmail: null,
            choferEmail: Store.currentEmail(),
            chofer: u.nombre,
            choferTelefono: u.telefono || '',
            patente: u.patente || '',
            origenComuna: carga.comuna, origenLat: carga.lat, origenLng: carga.lng,
            destinoId: planta.id, destinoNombre: planta.nombre,
            destinoLat: planta.lat, destinoLng: planta.lng,
            estado: 'programado',
            salida: null,                       // arranca cuando pulse "Iniciar"
            minutosTotal: min,
            progreso: 0, vehLat: null, vehLng: null, posicionAt: null,
            volumenDeclarado: carga.volumen,
            volumenRecibido: null, pesoRecibido: null, observaciones: '',
            // Si la carga pedia cuadrilla, queda asignada al tomar el servicio.
            cuadrillaEmail: cuadrilla ? cuadrilla.email : '',
            cuadrillaNombre: cuadrilla ? cuadrilla.nombre : '',
            creado: new Date().toISOString(),
          });

          Shell.notificar('Servicio aceptado',
            `${carga.comuna} → ${planta.nombre}` + (cuadrilla ? ` · Estiba: ${cuadrilla.nombre}` : ''));
          location.href = hayGps ? 'viaje.html?iniciar=1' : 'viaje.html';
        }
      }

      /* Revisa si llegaron cargas nuevas y avisa una sola vez por cada una.

         Con la base compartida escuchando en vivo, la copia en memoria ya
         viene actualizada y no hace falta volver a descargarla: por eso
         "recargar" solo es cierto cuando el aviso llegó por el reloj. */
      async function buscarNuevas({ avisar = true, recargar = true } = {}) {
        if (recargar && Store.enNube()) await Store.sincronizar({ forzar: true });
        const cargas = Store.cargasDisponibles(base);

        if (avisar) {
          // Un retiro encargado por una planta pesa más que una carga suelta:
          // alguien está esperando respuesta.
          const encargos = Store.serviciosAsignados().filter(e => !vistosEnvios.has(e.id));
          encargos.forEach(e => {
            const planta = Store.accountByEmail(e.empresaEmail);
            Shell.notificar('📨 Te encargaron un retiro',
              `${planta ? planta.nombre : 'Una planta'}: ${e.origenComuna} · ${e.volumenDeclarado} m³`);
          });

          const nuevas = cargas.filter(g => !vistos.has(g.id));
          if (nuevas.length === 1) {
            const g = nuevas[0];
            Shell.notificar('🌾 Nueva carga disponible',
              `${g.volumen} m³ en ${g.comuna}${g.km != null ? ' · a ' + g.km + ' km' : ''}`);
          } else if (nuevas.length > 1) {
            Shell.notificar('🌾 Nuevas cargas disponibles', `${nuevas.length} publicaciones nuevas`);
          }
        }
        cargas.forEach(g => vistos.add(g.id));
        Store.serviciosAsignados().forEach(e => vistosEnvios.add(e.id));
        render();
      }

      $('btn-refrescar').onclick = async () => {
        await buscarNuevas({ avisar: false });
        Shell.toast('Lista actualizada');
      };

      Shell.pedirPermisoNotificaciones();

      // Primera pasada sin avisar: todo lo que ya existe no es "nuevo".
      Store.cargasDisponibles(base).forEach(g => vistos.add(g.id));
      Store.serviciosAsignados().forEach(e => vistosEnvios.add(e.id));
      render();

      /* Las cargas que publica un viñatero aparecen acá apenas se publican,
         sin tocar nada. Si no hay base compartida, se revisa cada 20 s. */
      Ficha.montarAporte(document.getElementById('aporte-inicio'));

      Shell.enVivo(['cargas', 'envios'], info => {
        buscarNuevas({ avisar: true, recargar: info.tipo === 'RECARGA' });
      }, { cadaMs: 20000 });
    });
  </script>
</body>
</html>
