<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroConecta · Administración</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <img class="tb-logo" src="img/logo-claro.svg" alt="AgroConecta" width="38" height="38">
        <div><h1>Administración AgroConecta</h1><p id="tb-origen">Región del Maule</p></div>
        <div class="tb-actions">
          <button title="Recargar datos" id="btn-recargar">🔄</button>
          <button title="Ajustes" onclick="location.href='configuracion.html'">⚙️</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomnav"></nav>

  <script src="js/config.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vivo.js"></script>
  <script src="js/ruteo.js"></script>
  <script src="js/mosaico.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/comprobante.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/soporte.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/demo.js"></script>
  <script>
    Shell.init('admin', { rol: Store.ROL_ADMIN }).then(listo => { if (!listo) return;
      const $ = id => document.getElementById(id);
      const c = $('content');
      let pestana = 'resumen';

      /* -------- Datos -------- */
      const cuentas = () => Store.accounts();
      const porRol = r => cuentas().filter(a => Store.rolDe(a) === r);
      const cargas = () => Store.cargas();
      const puntos = () => Store.puntos();

      function origenTexto() {
        return Store.enNube()
          ? '☁️ Base compartida · los datos se ven desde cualquier dispositivo'
          : '💾 Base local · los datos solo existen en este navegador';
      }

      /* -------- Estructura -------- */
      function render() {
        c.innerHTML = `
          <div class="card pad" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="li-ic" style="background:${Store.enNube() ? 'rgba(25,118,210,.12);color:var(--info)' : 'rgba(249,168,37,.15);color:var(--warning)'}">
              ${Store.enNube() ? '☁️' : '💾'}</div>
            <div class="li-body" style="min-width:220px">
              <div class="li-title">${origenTexto()}</div>
              <div class="li-sub" id="aviso-origen">${Store.aviso() ? '⚠️ ' + Shell.escape(Store.aviso()) : 'Conexión correcta.'}</div>
            </div>
          </div>

          ${Soporte.hayCanal() ? '' : `
            <div class="card pad" style="margin-top:14px;border:1.5px dashed var(--warning)">
              <div class="list-item" style="padding:0">
                <div class="li-ic" style="background:rgba(249,168,37,.15);color:var(--warning)">🎧</div>
                <div class="li-body">
                  <div class="li-title">Servicio al cliente está apagado</div>
                  <div class="li-sub">
                    Nadie puede reportar problemas porque la administración no tiene
                    teléfono declarado. Ponlo en Ajustes → Teléfono y el botón aparece
                    solo en los tres perfiles.
                  </div>
                </div>
                <button class="btn" style="padding:10px 14px;font-size:13.5px"
                        onclick="location.href='configuracion.html'">Ir a Ajustes</button>
              </div>
            </div>`}

          <div class="tabs" style="margin-top:18px">
            <button class="tab ${pestana === 'resumen' ? 'active' : ''}" data-t="resumen">Resumen</button>
            <button class="tab ${pestana === 'cuentas' ? 'active' : ''}" data-t="cuentas">Cuentas</button>
            <button class="tab ${pestana === 'cargas' ? 'active' : ''}" data-t="cargas">Cargas</button>
            <button class="tab ${pestana === 'estiba' ? 'active' : ''}" data-t="estiba">Estiba</button>
            <button class="tab ${pestana === 'finanzas' ? 'active' : ''}" data-t="finanzas">Finanzas</button>
            <button class="tab ${pestana === 'puntos' ? 'active' : ''}" data-t="puntos">Plantas</button>
          </div>
          <div id="panel" class="stagger"></div>`;

        c.querySelectorAll('.tab').forEach(b => {
          b.onclick = () => { pestana = b.dataset.t; render(); };
        });
        ({ resumen, cuentas: panelCuentas, cargas: panelCargas,
           estiba: panelEstiba, finanzas: panelFinanzas, puntos: panelPuntos })[pestana]();
      }

      /* -------- Resumen -------- */
      function resumen() {
        const v = porRol(Store.ROL_VINATERO), e = porRol(Store.ROL_EMPRESA);
        const volumen = cargas().reduce((s, x) => s + (Number(x.volumen) || 0), 0);
        const suspendidas = cuentas().filter(a => a.activa === false).length;
        const stats = [
          { ic: '🍇', color: 'var(--leaf)', val: v.length, lbl: 'Viñateros', sub: 'Registrados' },
          { ic: '🏭', color: 'var(--primary)', val: e.length, lbl: 'Plantas', sub: 'Biomasa o compostaje' },
          { ic: '🌾', color: 'var(--leaf)', val: cargas().length, lbl: 'Cargas', sub: volumen + ' m³ publicados' },
          { ic: '♻️', color: 'var(--warning)', val: puntos().length, lbl: 'Plantas y acopios', sub: puntos().filter(p => p.activo !== false).length + ' con cupos' },
        ];
        $('panel').innerHTML = `
          <div class="grid cols-4" style="margin-top:16px">
            ${stats.map(s => `
              <div class="card stat-card">
                <div class="chip-ic" style="background:${Shell.tinte(s.color)};color:${s.color}">${s.ic}</div>
                <div class="val">${s.val}</div>
                <div class="lbl">${s.lbl}</div>
                <div class="sub">${s.sub}</div>
              </div>`).join('')}
          </div>
          ${suspendidas ? `<div class="card pad" style="margin-top:16px;display:flex;gap:12px;align-items:center">
            <span style="font-size:20px">⛔</span>
            <span>Hay <b>${suspendidas}</b> cuenta(s) suspendida(s). Revísalas en la pestaña <b>Cuentas</b>.</span>
          </div>` : ''}
          <div class="section">
            <div class="section-title">Cargas por comuna</div>
            <div class="grid" style="margin-top:12px">${porComunaHtml()}</div>
          </div>

          <!-- Herramienta de taller, no de operación: va al final, en gris
               y sin icono grande, porque se usa una vez antes de mostrar
               la aplicación y no todos los días. -->
          <div class="section">
            <button class="btn ghost" id="btn-demo"
                    style="font-size:13.5px;padding:11px 16px">
              🧪 Restablecer demo / Cargar datos oficiales
            </button>
            <div class="section-sub" style="margin-top:8px">
              Deja el escenario de Curicó, Molina, Talca y Linares listo para
              una demostración en vivo.
            </div>
          </div>`;

        $('btn-demo').onclick = panelDemo;
      }

      /* -------- Restablecer la demostración --------
         Lo que hace y lo que no, se dice antes de hacerlo.

         Con base local, "vaciar todo" es exactamente eso. Con la base
         compartida no puede serlo: ahí viven las cuentas de todos los que
         están usando la aplicación, y borrarlas para dejar bonita una
         presentación sería inaceptable. Por eso, en ese modo, solo se
         reemplazan los registros de demostración —los que terminan en
         @demo.agroconecta.cl— y se dice en pantalla. */
      function panelDemo() {
        const inv = Demo.inventario();
        const enNube = Store.enNube();
        const hayDemo = !!(inv.cuentas.length || inv.cargas.length
          || inv.envios.length || inv.movimientos.length);
        const hayUniversal = !!Store.accountByEmail(Demo.UNIVERSAL.email);

        Shell.openModal(`
          <div class="handle"></div>
          <div style="display:flex;align-items:center;gap:12px">
            <div class="li-ic" style="background:${Shell.tinte('var(--primary)')};color:var(--primary)">🧪</div>
            <div style="flex:1">
              <b style="font-size:17px">Datos de demostración</b>
              <div class="li-sub">Un escenario completo y siempre el mismo</div>
            </div>
          </div>

          <!-- El perfil universal se puede crear solo, sin el escenario
               completo: sirve para repartir un acceso de prueba sin meter
               cargas y envíos en una base que está en uso. -->
          <div class="card pad" style="margin-top:14px;border:1.5px solid var(--primary-light)">
            <div class="list-item" style="padding:0">
              <div class="li-ic" style="background:${Shell.tinte('var(--primary-light)')};color:var(--primary-light)">👀</div>
              <div class="li-body">
                <div class="li-title">Perfil de demostración universal</div>
                <div class="li-sub">
                  ${hayUniversal
                    ? 'Ya existe. Entra con <b>' + Shell.escape(Demo.UNIVERSAL.email)
                      + '</b> y clave <b>' + Shell.escape(Demo.CLAVE)
                      + '</b>, y cambia de perfil desde la barra de arriba.'
                    : 'Una sola cuenta para recorrer los cuatro perfiles: viñatero, '
                      + 'transportista, cargador y planta, sin cerrar sesión.'}
                </div>
              </div>
              ${hayUniversal ? '' : `
                <button class="btn" style="padding:10px 14px;font-size:13.5px"
                        id="demo-universal">Crear</button>`}
            </div>
          </div>

          <div class="card pad" style="background:var(--surface-alt);margin-top:14px">
            <div class="li-sub"><b>Se va a sembrar:</b></div>
            <div class="li-sub" style="margin-top:4px">
              🍇 Dos viñas (Curicó y Linares) · 🏭 una planta en Talca ·
              🚚 un transportista con tropa · 💪 un cargador individual
            </div>
            <div class="li-sub" style="margin-top:4px">
              🌾 Cuatro cargas publicadas · 🔗 un viaje en curso consolidando
              Curicó y Molina · ✅ una entrega cerrada con pesaje validado y
              su Sello Verde
            </div>
            <div class="li-sub" style="margin-top:8px">
              Las cuentas entran con la clave <b>${Shell.escape(Demo.CLAVE)}</b>
              y todas terminan en <b>${Shell.escape(Demo.DOMINIO)}</b>.
            </div>
          </div>

          ${hayDemo ? `
            <div class="card pad" style="margin-top:12px;border:1.5px solid var(--primary)">
              <div class="li-title">Ahora mismo hay datos de demostración cargados</div>
              <div class="li-sub" style="margin-top:4px">
                ${inv.cuentas.length} cuenta(s), ${inv.cargas.length} carga(s),
                ${inv.envios.length} envío(s) y ${inv.movimientos.length} movimiento(s).
                ${enNube
                  ? 'Los están viendo todos los que entren a la aplicación.'
                  : 'Solo existen en este navegador.'}
              </div>
              <div class="li-sub" style="margin-top:4px">
                Volver a cargarlos los reemplaza, no los duplica.
              </div>
            </div>` : ''}

          <div class="card pad" style="margin-top:12px;border:1.5px dashed ${
            enNube ? 'var(--info)' : 'var(--warning)'}">
            <div class="li-sub">
              ${enNube
                ? '☁️ <b>Base compartida.</b> Esto solo toca los registros de demostración: '
                  + 'las cuentas y las cargas reales de quienes usan la aplicación no se '
                  + 'tocan, en ningún caso. Vaciar todo no está disponible acá, porque '
                  + 'borraría datos que no son tuyos.'
                : '💾 <b>Base local.</b> Los datos son solo de este navegador, así que '
                  + 'acá sí se puede vaciar todo y volver a cero.'}
            </div>
          </div>

          <button class="btn block" style="margin-top:14px" id="demo-cargar">
            ${hayDemo ? '🔄 Volver a cargar los datos de demostración'
                      : '▶ Cargar datos de demostración'}
          </button>
          ${hayDemo ? `
            <button class="btn ghost block" style="margin-top:10px" id="demo-limpiar">
              🧹 Quitar los datos de demostración
            </button>` : ''}
          ${enNube ? '' : `
            <button class="btn ghost block" style="margin-top:10px;color:var(--danger)"
                    id="demo-vaciar">
              🗑️ Vaciar todo y volver a cero
            </button>`}
          <button class="btn ghost block" style="margin-top:10px"
                  onclick="Shell.closeModal()">Cancelar</button>`);

        const universal = $('demo-universal');
        if (universal) universal.onclick = async () => {
          universal.disabled = true;
          const error = await Demo.crearUniversal();
          Shell.closeModal();
          if (error) return Shell.toast(error);
          await Store.sincronizar({ forzar: true });
          render();
          Shell.toast('Perfil de demostración creado: ' + Demo.UNIVERSAL.email);
        };

        $('demo-cargar').onclick = async () => {
          const b = $('demo-cargar');
          b.disabled = true;
          b.textContent = 'Sembrando el escenario…';
          const r = await Demo.cargar();
          Shell.closeModal();
          if (r.error) return Shell.toast(r.error);
          await Store.sincronizar({ forzar: true });
          render();
          Shell.toast(`Demo lista: ${r.cuentas} cuentas, ${r.cargas} cargas, ${r.envios} envíos`);
        };

        /* Quitar sin volver a sembrar. Faltaba: con la base compartida el
           panel solo dejaba cargar, así que una vez sembrada la
           demostración no había forma de dejarla limpia desde la
           aplicación. Se borra exactamente lo mismo que reemplazaría una
           recarga, ni un registro más. */
        const limpiar = $('demo-limpiar');
        if (limpiar) limpiar.onclick = () => confirmar(
          'Quitar los datos de demostración',
          `Se borran ${inv.cuentas.length} cuenta(s) @demo.agroconecta.cl y todo `
          + `lo suyo: ${inv.cargas.length} carga(s), ${inv.envios.length} envío(s) `
          + `y ${inv.movimientos.length} movimiento(s). Las cuentas y las cargas `
          + 'reales no se tocan.',
          async () => {
            const b = await Demo.limpiar();
            await Store.sincronizar({ forzar: true });
            render();
            Shell.toast(`Quitados: ${b.cuentas} cuentas, ${b.cargas} cargas, `
              + `${b.envios} envíos, ${b.movimientos} movimientos`);
          });

        const vaciar = $('demo-vaciar');
        if (vaciar) vaciar.onclick = () => confirmar(
          'Vaciar todo',
          'Se borran las cuentas, las cargas, los envíos y el libro de '
          + 'movimientos de este navegador. La administración y las plantas '
          + 'del mapa se vuelven a sembrar solas. No se puede deshacer.',
          async () => {
            const error = await Demo.vaciarTodo();
            if (error) return Shell.toast(error);
            render();
            Shell.toast('Base local vacía');
          });
      }

      function porComunaHtml() {
        const cuenta = {};
        cargas().forEach(x => { cuenta[x.comuna] = (cuenta[x.comuna] || 0) + (Number(x.volumen) || 0); });
        const filas = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
        if (!filas.length) return `<div class="empty"><div class="ic">🌾</div><p>Todavía no hay cargas publicadas</p></div>`;
        const mayor = filas[0][1];
        return filas.map(([comuna, m3]) => `
          <div class="card pad">
            <div style="display:flex;align-items:center;gap:10px">
              <b style="flex:1">${Shell.escape(comuna)}</b>
              <span class="li-sub">${m3} m³</span>
            </div>
            <div class="progress" style="margin-top:8px">
              <div style="width:${(m3 / mayor * 100).toFixed(0)}%;background:var(--primary)"></div>
            </div>
          </div>`).join('');
      }

      /* -------- Finanzas --------
         El tablero maestro: comisiones, fondo de imprevistos y caja. Se
         arma sumando el libro de movimientos, no recalculando nada: si
         una cifra esta mal, esta mal en el libro, que es donde se puede
         revisar. */
      function panelFinanzas() {
        const comision = Store.totalPlataforma('comision');
        const reserva = Store.totalPlataforma('reserva');
        const membresias = Store.movimientos()
          .filter(m => m.tipo === 'membresia')
          .reduce((t, m) => t + Math.abs(m.monto), 0);

        const envios = Store.envios();
        const retenidos = envios.filter(e => e.escrowEstado === 'retenido');
        const enCustodia = retenidos.reduce((t, e) => {
          const r = Finanzas.repartoDe(e);
          return t + (r ? r.total : 0);
        }, 0);

        const stats = [
          { ic: '⚙️', color: 'var(--leaf)', val: Finanzas.pesos(comision),
            lbl: 'Comisiones', sub: '10% de cada flete' },
          { ic: '🛟', color: 'var(--primary)', val: Finanzas.pesos(reserva),
            lbl: 'Fondo de imprevistos', sub: '5% retenido' },
          { ic: '💳', color: 'var(--primary-light)', val: Finanzas.pesos(membresias),
            lbl: 'Membresías', sub: 'Cobrado a plantas' },
          { ic: '🔒', color: 'var(--warning)', val: Finanzas.pesos(enCustodia),
            lbl: 'En custodia', sub: retenidos.length + ' flete(s) sin liquidar' },
        ];

        const pendientes = Store.solicitudesDePlan();
        const suscritas = Store.suscripcionesActivas();

        const movs = Store.movimientos()
          .slice().sort((a, b) => (b.creado || '').localeCompare(a.creado || ''))
          .slice(0, 25);

        document.getElementById('panel').innerHTML = `
          <div class="card pad" style="margin-top:4px;background:var(--surface-alt)">
            <div class="li-sub">
              ⚠️ <b>Simulación.</b> No hay pasarela de pagos conectada: la aplicación
              no cobra ni transfiere dinero real. Esto es el registro de lo que se
              movería.
            </div>
          </div>

          <div class="grid cols-4" style="margin-top:16px">
            ${stats.map(x => `
              <div class="card stat-card">
                <div class="chip-ic" style="background:${Shell.tinte(x.color)};color:${x.color}">${x.ic}</div>
                <div class="val">${x.val}</div>
                <div class="lbl">${x.lbl}</div>
                <div class="sub">${x.sub}</div>
              </div>`).join('')}
          </div>

          <div class="section">
            <div class="section-title">Solicitudes de membresía</div>
            <div class="section-sub">
              ${pendientes.length
                ? pendientes.length + ' esperando tu respuesta'
                : 'Ninguna pendiente'}
            </div>
          </div>
          ${pendientes.length === 0
            ? `<div class="empty"><div class="ic">📨</div><p>No hay solicitudes pendientes.</p></div>`
            : `<div class="grid" style="margin-top:12px">
                ${pendientes.map(c => {
                  const plan = Finanzas.planesDe(c).find(p => p.id === c.plan);
                  return `
                    <div class="card pad">
                      <div class="list-item" style="padding:0">
                        <div class="li-ic" style="background:rgba(249,168,37,.15);color:var(--warning)">⏳</div>
                        <div class="li-body">
                          <div class="li-title">${Shell.escape(c.nombre)}</div>
                          <div class="li-sub">${Shell.escape(c.email)} · ${Store.etiquetaCuenta(c)}</div>
                          <div class="li-sub">
                            ${plan ? Shell.escape(plan.label) + ' · ' + Finanzas.pesos(plan.precio) : 'Plan desconocido'}
                            ${c.plan_pedido_at ? ' · pedida el ' + new Date(c.plan_pedido_at).toLocaleDateString('es-CL') : ''}
                          </div>
                        </div>
                      </div>
                      <div class="field-row" style="margin-top:12px">
                        <button class="btn ghost" style="flex:1" data-rechazar-plan="${Shell.escape(c.email)}">Rechazar</button>
                        <button class="btn" style="flex:1" data-aprobar-plan="${Shell.escape(c.email)}">✅ Aprobar</button>
                      </div>
                    </div>`;
                }).join('')}
              </div>`}

          ${suscritas.length ? `
            <div class="section">
              <div class="section-title">Membresías vigentes</div>
              <div class="section-sub">${suscritas.length} cuenta(s)</div>
            </div>
            <div class="grid" style="margin-top:12px">
              ${suscritas.map(c => {
                const plan = Finanzas.planesDe(c).find(p => p.id === c.plan);
                const cancelada = c.plan_estado === 'cancelada';
                return `
                  <div class="card list-item">
                    <div class="li-ic" style="background:${cancelada ? 'var(--surface-alt)' : 'rgba(46,125,50,.13)'}">
                      ${cancelada ? '⏹' : '✅'}
                    </div>
                    <div class="li-body">
                      <div class="li-title">${Shell.escape(c.nombre)}</div>
                      <div class="li-sub">
                        ${plan ? Shell.escape(plan.label) : ''} ·
                        ${cancelada ? 'no se renueva · ' : ''}${Finanzas.diasRestantes(c)} día(s)
                      </div>
                    </div>
                    ${cancelada ? '' :
                      `<button class="link-btn" style="color:var(--danger)"
                               data-cancelar-ajeno="${Shell.escape(c.email)}">Cancelar</button>`}
                    <button class="link-btn" data-limpiar-plan="${Shell.escape(c.email)}">Borrar</button>
                  </div>`;
              }).join('')}
            </div>` : ''}

          ${retenidos.length ? `
            <div class="section">
              <div class="section-title">Fletes en custodia</div>
              <div class="section-sub">Se liberan cuando la planta valide la descarga</div>
            </div>
            <div class="grid" style="margin-top:12px">
              ${retenidos.map(e => {
                const r = Finanzas.repartoDe(e);
                return `
                  <div class="card list-item">
                    <div class="li-ic" style="background:rgba(249,168,37,.15);color:var(--warning)">🔒</div>
                    <div class="li-body">
                      <div class="li-title">${Shell.escape(e.origenComuna)} → ${Shell.escape(e.destinoNombre)}</div>
                      <div class="li-sub">${Shell.escape(e.chofer || 'sin transportista')} · ${estadoEnvio(e.estado).label}</div>
                    </div>
                    <b>${Finanzas.pesos(r ? r.total : 0)}</b>
                  </div>`;
              }).join('')}
            </div>` : ''}

          <div class="section">
            <div class="section-title">Movimientos</div>
            <div class="section-sub">Los ${movs.length} más recientes</div>
          </div>
          ${movs.length === 0
            ? `<div class="empty"><div class="ic">📒</div><p>Todavía no hay movimientos.</p></div>`
            : `<div class="grid" style="margin-top:12px">
                ${movs.map(m => `
                  <div class="card list-item">
                    <div class="li-ic" style="background:var(--surface-alt)">
                      ${m.tipo === 'comision' ? '⚙️' : m.tipo === 'reserva' ? '🛟'
                        : m.tipo === 'membresia' ? '💳' : m.tipo === 'retencion' ? '🔒' : '💰'}
                    </div>
                    <div class="li-body">
                      <div class="li-title">${Shell.escape(m.concepto)}</div>
                      <div class="li-sub">
                        ${m.email ? Shell.escape(m.email) : 'AgroConecta'} ·
                        ${new Date(m.creado).toLocaleDateString('es-CL',
                          { day: '2-digit', month: '2-digit', year: 'numeric' })}
                      </div>
                    </div>
                    <b style="color:${m.monto < 0 ? 'var(--danger)' : 'var(--leaf)'}">
                      ${m.monto < 0 ? '' : '+'}${Finanzas.pesos(m.monto)}
                    </b>
                    <button class="link-btn" style="color:var(--danger)"
                            data-borrar-mov="${Shell.escape(m.id)}">Eliminar</button>
                  </div>`).join('')}
              </div>`}`;

        const panel = document.getElementById('panel');
        const resolver = async (fn, email, aviso) => {
          const error = await fn(email);
          if (error) return Shell.toast(error);
          Shell.toast(aviso);
          render();
        };
        panel.querySelectorAll('[data-aprobar-plan]').forEach(b => {
          b.onclick = () => resolver(e => Store.aprobarPlan(e), b.dataset.aprobarPlan, 'Membresía aprobada');
        });
        panel.querySelectorAll('[data-rechazar-plan]').forEach(b => {
          b.onclick = () => resolver(e => Store.rechazarPlan(e), b.dataset.rechazarPlan, 'Solicitud rechazada');
        });
        panel.querySelectorAll('[data-borrar-mov]').forEach(b => {
          b.onclick = () => confirmar('Eliminar movimiento',
            'Desaparece del libro y de los totales. No se puede deshacer.',
            () => resolver(id => Store.borrarMovimiento(id), b.dataset.borrarMov, 'Movimiento eliminado'));
        });
        panel.querySelectorAll('[data-limpiar-plan]').forEach(b => {
          b.onclick = () => confirmar('Borrar la membresía',
            'La cuenta queda sin plan y sin fecha, como si nunca hubiera contratado. Los cargos ya registrados no se tocan.',
            () => resolver(e => Store.limpiarMembresia(e), b.dataset.limpiarPlan, 'Membresía borrada'));
        });
        panel.querySelectorAll('[data-cancelar-ajeno]').forEach(b => {
          b.onclick = () => confirmar('Cancelar membresía',
            'La cuenta conserva el acceso hasta la fecha ya pagada, pero no se renovará.',
            () => resolver(e => Store.cancelarPlan(e), b.dataset.cancelarAjeno, 'Membresía cancelada'));
        });
      }

      /* -------- Estiba --------
         Acá el equipo de AgroConecta deriva a los cargadores individuales:
         les da la ruta, y con ella el chofer al que van a asistir.

         Es la administración y no la planta quien lo hace porque el
         cargador individual no pertenece a ninguna empresa: no tiene a
         quién pedirle trabajo, y sin alguien que lo derive quedaría
         registrado pero sin que le llegue nada. */
      function panelEstiba() {
        const cargadores = Store.cargadoresIndividuales();
        const todos = Store.accounts().filter(a => Store.esSoloCargador(a));

        // Retiros vivos que pidieron cargadores o que aún no tienen quién cargue.
        const abiertos = Store.envios().filter(e => e.estado !== 'entregado');

        const caja = document.getElementById('panel');
        caja.innerHTML = `
          <div class="section" style="margin-top:4px">
            <div class="section-title">Cargadores individuales</div>
            <div class="section-sub">
              ${todos.length === 0
                ? 'Nadie se ha registrado con esta modalidad'
                : `${cargadores.length} disponible(s) de ${todos.length} registrado(s)`}
            </div>
          </div>

          ${todos.length === 0
            ? `<div class="empty">
                 <div class="ic">💪</div>
                 <p>Ningún cargador individual registrado.</p>
                 <p style="font-size:13px">
                   Se registran como transportista y eligen la modalidad
                   <b>Cargador individual</b> en Ajustes.
                 </p>
               </div>`
            : `<div class="grid" style="margin-top:12px">
                ${todos.map(c => {
                  const asignados = Store.envios().filter(e =>
                    e.cuadrillaEmail === c.email && e.estado !== 'entregado');
                  return `
                    <div class="card list-item">
                      <div class="li-ic" style="background:rgba(25,118,210,.12);color:var(--info)">
                        ${c.estiba === 'cuadrilla' ? '👥' : '💪'}
                      </div>
                      <div class="li-body">
                        <div class="li-title">${Shell.escape(Store.nombreDeEstiba(c) || c.nombre)}</div>
                        <div class="li-sub">
                          ${Shell.escape(c.email)}${c.comuna ? ' · ' + Shell.escape(c.comuna) : ''}
                          · ${Store.personasDeEstiba(c)} persona(s)
                        </div>
                        <div class="li-sub">
                          ${c.disponible === false ? '⚪ No disponible'
                            : asignados.length ? '🟠 ' + asignados.length + ' retiro(s) asignado(s)'
                            : '🟢 Libre'}
                        </div>
                      </div>
                    </div>`;
                }).join('')}
              </div>`}

          <div class="section">
            <div class="section-title">Derivar a un retiro</div>
            <div class="section-sub">
              Dale la ruta: el cargador verá a qué viña ir y a qué transportista asiste
            </div>
          </div>

          ${abiertos.length === 0
            ? `<div class="empty"><div class="ic">🚚</div><p>No hay retiros en curso.</p></div>`
            : `<div class="grid" style="margin-top:12px">
                ${abiertos.map(e => `
                  <div class="card pad">
                    <div class="list-item" style="padding:0">
                      <div class="li-ic" style="background:rgba(239,108,0,.12);color:var(--in-progress)">🚚</div>
                      <div class="li-body">
                        <div class="li-title">${Shell.escape(e.origenComuna)} → ${Shell.escape(e.destinoNombre)}</div>
                        <div class="li-sub">
                          ${e.volumenDeclarado} m³ · transportista: ${Shell.escape(e.chofer || 'sin asignar')}
                        </div>
                        <div class="li-sub">
                          ${e.cuadrillaNombre
                            ? '💪 Carga: ' + Shell.escape(e.cuadrillaNombre)
                            : '— Sin cargador asignado'}
                        </div>
                      </div>
                    </div>
                    <div class="field" style="margin-top:12px;margin-bottom:0">
                      <select data-derivar="${Shell.escape(e.id)}">
                        <option value="">Sin cargador</option>
                        ${cargadores.map(c => `
                          <option value="${Shell.escape(c.email)}" ${
                            c.email === e.cuadrillaEmail ? 'selected' : ''}>${
                            Shell.escape(Store.nombreDeEstiba(c) || c.nombre)} · ${
                            Store.personasDeEstiba(c)} persona(s)</option>`).join('')}
                      </select>
                    </div>
                  </div>`).join('')}
              </div>`}`;

        caja.querySelectorAll('[data-derivar]').forEach(sel => {
          sel.onchange = async () => {
            sel.disabled = true;
            const error = await Store.derivarCargador(sel.dataset.derivar, sel.value);
            sel.disabled = false;
            if (error) return Shell.toast(error);
            Shell.toast(sel.value ? 'Cargador derivado' : 'Retiro sin cargador');
            render();
          };
        });
      }

      /* -------- Cuentas -------- */
      /* Desde cuándo existe la cuenta y, si quedó anotado, cuándo entró por
         última vez. Las fechas viejas pueden venir vacías. */
      function historialCuenta(a) {
        const fecha = t => {
          const d = new Date(t);
          return isNaN(d) ? null : d.toLocaleDateString('es-CL', {
            day: '2-digit', month: '2-digit', year: 'numeric',
          });
        };
        const alta = a.creada ? fecha(a.creada) : null;
        const ultimo = a.ultimo_acceso ? fecha(a.ultimo_acceso) : null;
        const partes = [];
        if (alta) partes.push('Registrada el ' + alta);
        if (ultimo) partes.push('último acceso ' + ultimo);
        if (a.accesos) partes.push(a.accesos + ' ingreso(s)');
        return partes.length ? Shell.escape(partes.join(' · ')) : 'Sin fecha de registro';
      }

      function panelCuentas() {
        const lista = cuentas().slice().sort((a, b) => Store.rolDe(a).localeCompare(Store.rolDe(b)));
        $('panel').innerHTML = `
          <div class="section" style="margin-top:16px">
            <div class="section-title">Cuentas registradas</div>
            <div class="section-sub">${lista.length} en total. Puedes suspender o eliminar cuentas.</div>
          </div>
          <div class="grid" style="margin-top:12px">
            ${lista.map(a => {
              const rol = Store.rolDe(a);
              const ic = rol === Store.ROL_ADMIN ? '🛠️'
                : rol === Store.ROL_EMPRESA ? '🏭'
                : Store.esSoloCargador(a) ? '💪'
                : rol === Store.ROL_CHOFER ? '🚚' : '🍇';
              const suspendida = a.activa === false;
              const esYo = a.email === Store.currentEmail();
              return `
                <div class="card list-item">
                  <div class="li-ic" style="background:var(--surface-alt)">${ic}</div>
                  <div class="li-body">
                    <div class="li-title">${Shell.escape(a.nombre)} ${esYo ? '<span class="li-sub">(tu cuenta)</span>' : ''}</div>
                    <div class="li-sub">${Shell.escape(a.email)} · ${Store.etiquetaCuenta(a)}${a.comuna ? ' · ' + Shell.escape(a.comuna) : ''}</div>
                    ${rol === Store.ROL_CHOFER
                      ? `<div class="li-sub">${Shell.escape(Shell.etiquetaModalidad(a))}</div>` : ''}
                    <div class="li-sub">${historialCuenta(a)}</div>
                    <div style="margin-top:6px">
                      ${suspendida ? Shell.badge('Suspendida', 'var(--danger)', '⛔') : Shell.badge('Activa', 'var(--leaf)', '✅')}
                      ${a.porDefecto ? ' ' + Shell.badge('Clave por defecto', 'var(--warning)', '⚠️') : ''}
                    </div>
                  </div>
                  ${esYo ? '' : `
                    <button class="link-btn" data-suspender="${Shell.escape(a.email)}">${suspendida ? 'Reactivar' : 'Suspender'}</button>
                    <button class="link-btn" style="color:var(--danger)" data-borrar="${Shell.escape(a.email)}">Eliminar</button>`}
                </div>`;
            }).join('')}
          </div>`;

        $('panel').querySelectorAll('[data-suspender]').forEach(b => {
          b.onclick = async () => {
            const a = Store.accountByEmail(b.dataset.suspender);
            await Store.upsertAccount({ ...a, activa: a.activa === false });
            Shell.toast(a.activa === false ? 'Cuenta reactivada' : 'Cuenta suspendida');
            render();
          };
        });
        $('panel').querySelectorAll('[data-borrar]').forEach(b => {
          b.onclick = () => confirmar(
            'Eliminar cuenta',
            `Se eliminará <b>${Shell.escape(b.dataset.borrar)}</b> y todas sus cargas publicadas. Esto no se puede deshacer.`,
            async () => { await Store.borrarCuenta(b.dataset.borrar); Shell.toast('Cuenta eliminada'); render(); });
        });
      }

      /* -------- Cargas -------- */
      function panelCargas() {
        const lista = cargas();
        $('panel').innerHTML = `
          <div class="section" style="margin-top:16px">
            <div class="section-title">Cargas publicadas</div>
            <div class="section-sub">${lista.length} carga(s) de los viñateros registrados</div>
          </div>
          ${lista.length === 0
            ? `<div class="empty"><div class="ic">🌾</div><p>Todavía no hay cargas publicadas</p></div>`
            : `<div class="grid" style="margin-top:12px">${lista.map(x => {
                const dueno = Store.accountByEmail(x.ownerEmail);
                return `
                  <div class="card list-item">
                    <div class="li-ic" style="background:rgba(46,125,50,.12);color:var(--primary)">🌾</div>
                    <div class="li-body">
                      <div class="li-title">${x.volumen} m³ · ${Shell.escape(x.comuna)}</div>
                      <div class="li-sub">${dueno ? Shell.escape(dueno.nombre) : 'Cuenta eliminada'} · ${Shell.escape(x.ownerEmail || '')}</div>
                      <div class="li-sub">Destino: ${Shell.escape(x.destino)} · Disponible: ${Shell.escape(x.fecha || 'sin fecha')}</div>
                    </div>
                    <button class="link-btn" style="color:var(--danger)" data-carga="${Shell.escape(x.id)}">Eliminar</button>
                  </div>`;
              }).join('')}</div>`}`;

        $('panel').querySelectorAll('[data-carga]').forEach(b => {
          b.onclick = () => confirmar('Eliminar carga',
            'Se quitará esta publicación de la plataforma.',
            async () => { await Store.removeCarga(b.dataset.carga); Shell.toast('Carga eliminada'); render(); });
        });
      }

      /* -------- Plantas y centros -------- */
      function panelPuntos() {
        const lista = puntos();
        $('panel').innerHTML = `
          <div class="section" style="margin-top:16px">
            <div class="section-title">Plantas y centros de acopio</div>
            <div class="section-sub">${lista.length} punto(s) en el mapa</div>
          </div>
          <button class="btn block" style="margin-top:12px" id="btn-nuevo">➕ Agregar planta o centro</button>
          <div class="grid" style="margin-top:12px">
            ${lista.map(p => {
              const color = tipoColor(p.tipo, p.activo);
              return `
                <div class="card list-item">
                  <div class="li-ic" style="background:${Shell.tinte(color)};color:${color}">${recibeSarmientos(p.tipo) ? '♻️' : p.tipo === 'Transporte' ? '🚚' : '📦'}</div>
                  <div class="li-body">
                    <div class="li-title">${Shell.escape(p.nombre)}</div>
                    <div class="li-sub">${p.tipo} · ${Shell.escape(p.comuna)}${p.cap != null ? ' · ' + p.cap + ' m³' : ''}</div>
                    <div class="li-sub">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</div>
                    <div style="margin-top:6px">${p.activo !== false ? Shell.badge('Con cupos', 'var(--leaf)', '✅') : Shell.badge('Sin cupos', 'var(--danger)', '⛔')}</div>
                  </div>
                  <button class="link-btn" data-cupos="${Shell.escape(p.id)}">${p.activo !== false ? 'Cerrar cupos' : 'Abrir cupos'}</button>
                  <button class="link-btn" style="color:var(--danger)" data-punto="${Shell.escape(p.id)}">Eliminar</button>
                </div>`;
            }).join('')}
          </div>`;

        $('btn-nuevo').onclick = formularioPunto;

        $('panel').querySelectorAll('[data-cupos]').forEach(b => {
          b.onclick = async () => {
            const p = puntos().find(x => x.id === b.dataset.cupos);
            await Store.guardarPunto({ ...p, activo: p.activo === false });
            Shell.toast('Cupos actualizados');
            render();
          };
        });
        $('panel').querySelectorAll('[data-punto]').forEach(b => {
          b.onclick = () => confirmar('Eliminar punto',
            'Se quitará del mapa y del buscador de empresas.',
            async () => { await Store.borrarPunto(b.dataset.punto); Shell.toast('Punto eliminado'); render(); });
        });
      }

      /* Alta de una planta nueva: la comuna define las coordenadas. */
      function formularioPunto() {
        Shell.openModal(`
          <div class="handle"></div>
          <b style="font-size:18px">Nueva planta o centro</b>
          <div class="field" style="margin-top:16px"><label>Nombre</label>
            <input class="input" id="p-nombre" placeholder="Ej: Compost Río Claro"></div>
          <div class="field"><label>Tipo</label>
            <select id="p-tipo">
              <option>Biomasa</option><option>Compostaje</option><option>Acopio</option>
            </select></div>
          <div class="field"><label>Comuna</label>
            <select id="p-comuna">${DATA.comunas.map(x => `<option>${x.nombre}</option>`).join('')}</select></div>
          <div class="field"><label>Capacidad (m³)</label>
            <input class="input" id="p-cap" type="number" min="1" placeholder="Ej: 30"></div>
          <div class="field"><label>Descripción</label>
            <textarea id="p-desc" rows="2" placeholder="Qué recibe, horarios, accesos…"></textarea></div>
          <div class="err" id="p-err"></div>
          <div class="field-row">
            <button class="btn ghost" style="flex:1" onclick="Shell.closeModal()">Cancelar</button>
            <button class="btn" style="flex:1" id="p-guardar">Guardar</button>
          </div>`);

        $('p-guardar').onclick = async () => {
          const nombre = $('p-nombre').value.trim();
          if (!nombre) return ($('p-err').textContent = 'Ingresa el nombre');
          const comuna = $('p-comuna').value;
          const coord = Shell.coordComuna(comuna);
          if (!coord) return ($('p-err').textContent = 'Esa comuna no tiene coordenadas');
          await Store.guardarPunto({
            id: 'p-' + Date.now(),
            nombre, tipo: $('p-tipo').value, comuna,
            desc: $('p-desc').value.trim(),
            cap: parseFloat($('p-cap').value) || null,
            activo: true, lat: coord.lat, lng: coord.lng,
          });
          Shell.closeModal();
          Shell.toast('Punto agregado al mapa');
          render();
        };
      }

      /* -------- Confirmación para acciones que borran -------- */
      function confirmar(titulo, mensaje, alAceptar) {
        Shell.openModal(`
          <div class="handle"></div>
          <b style="font-size:18px">${titulo}</b>
          <p style="margin:14px 0;line-height:1.45">${mensaje}</p>
          <div class="field-row">
            <button class="btn ghost" style="flex:1" onclick="Shell.closeModal()">Cancelar</button>
            <button class="btn" style="flex:1;background:var(--danger)" id="ok-borrar">Sí, eliminar</button>
          </div>`);
        $('ok-borrar').onclick = async () => { Shell.closeModal(); await alAceptar(); };
      }

      $('btn-recargar').onclick = async () => {
        await Store.sincronizar({ forzar: true });
        render();
        Shell.toast('Datos recargados');
      };

      $('tb-origen').textContent = Store.enNube() ? 'Base compartida' : 'Base local';
      render();
    });
  </script>
</body>
</html>
