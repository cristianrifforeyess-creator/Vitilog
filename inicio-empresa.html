<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroConecta · Inicio Empresa</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <img class="tb-logo" src="img/logo-claro.svg" alt="AgroConecta" width="38" height="38">
        <div><h1>AgroConecta · Empresas</h1><p>Región del Maule</p></div>
        <div class="tb-actions">
          <button title="Notificaciones" id="btn-notif">🔔</button>
          <button title="Ajustes" onclick="location.href='configuracion.html'">⚙️</button>
        </div>
      </div>
      <div class="content">
        <!-- Resumen de la próxima ruta: la misma tarjeta de Rutas e Historial. -->
        <div id="proxima-ruta"></div>
        <div class="stagger" id="content"></div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomnav"></nav>

  <script src="js/config.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vivo.js"></script>
  <script src="js/ruteo.js"></script>
  <script src="js/mosaico.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/comprobante.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/soporte.js"></script>
  <script src="js/shell.js"></script>
  <script>
    Shell.init('inicio', { rol: Store.ROL_EMPRESA }).then(listo => { if (!listo) return;
      const u = Store.currentUser();
      const cargas = Store.cargasPublicadas();

      // Resumen calculado sobre las cargas realmente publicadas.
      const volumen = cargas.reduce((s, c) => s + c.volumen, 0);
      const comunas = new Set(cargas.map(c => c.comuna)).size;
      const mwh = (volumen * 0.3).toFixed(1);   // ~0,3 MWh por m³ de sarmiento

      const stats = [
        { ic: '🌾', color: 'var(--leaf)', val: String(cargas.length), lbl: 'Cargas Disponibles', sub: 'Publicadas' },
        { ic: '📦', color: 'var(--leaf)', val: volumen + ' m³', lbl: 'Volumen Ofertado', sub: 'Sarmientos' },
        { ic: '📍', color: 'var(--primary)', val: String(comunas), lbl: 'Comunas', sub: 'Con oferta activa' },
        { ic: '🔥', color: 'var(--warning)', val: mwh + ' MWh', lbl: 'Potencial Energético', sub: 'Aprovechable' },
      ];

      /* Flota vinculada: quiénes son, si están libres y qué llevan ahora.
         El vínculo lo declara cada transportista en su propio perfil. */
      const flota = Store.miFlota();
      const flotaHtml = flota.length === 0
        ? `<div class="empty">
             <div class="ic">🚚</div>
             <p>Ningún transportista se ha vinculado a tu planta.</p>
             <p style="font-size:13px">Cada uno se vincula desde su perfil, en Ajustes → Cómo trabajas. Una vez vinculado, puedes encargarle retiros directamente.</p>
           </div>`
        : flota.map(f => {
            const viaje = Store.envios().find(e =>
              e.choferEmail === f.email && e.estado !== 'entregado');
            const est = viaje ? estadoEnvio(viaje.estado) : null;
            const libre = viaje ? Store.capacidadRestante(viaje, f) : (Number(f.capacidad) || 0);
            return `
              <div class="card list-item" ${viaje ? `style="cursor:pointer" data-viaje="${Shell.escape(viaje.id)}"` : ''}>
                <div class="li-ic" style="background:${est ? est.color + '22' : 'rgba(46,125,50,.13)'};color:${est ? est.color : 'var(--primary)'}">${est ? est.ic : '🚚'}</div>
                <div class="li-body">
                  <div class="li-title">${Shell.escape(f.nombre)}${f.patente ? ' · ' + Shell.escape(f.patente) : ''}</div>
                  <div class="li-sub">
                    ${viaje
                      ? est.label + ' · ' + Shell.escape(viaje.origenComuna) + ' → ' + Shell.escape(viaje.destinoNombre)
                      : (f.disponible === false ? 'No disponible' : 'Libre')}
                  </div>
                  <div class="li-sub">${f.capacidad ? libre + ' de ' + f.capacidad + ' m³ libres' : 'Sin capacidad declarada'}</div>
                </div>
                ${viaje ? '<div class="li-chev">›</div>' : ''}
              </div>`;
          }).join('');

      /* Quién puede cargar: los cargadores individuales y los
         transportistas que llevan su propia tropa. La planta los ve para
         saber con qué cuenta. */
      const estibas = Store.cuadrillasDisponibles()
        .sort((a, b) => Store.personasDeEstiba(b) - Store.personasDeEstiba(a));
      const personasTotales = estibas.reduce((t, e) => t + Store.personasDeEstiba(e), 0);

      const estibasHtml = estibas.length === 0
        ? `<div class="empty">
             <div class="ic">👷</div>
             <p>No hay equipos de estiba disponibles.</p>
             <p style="font-size:13px">
               Son los cargadores individuales y los transportistas que llevan
               su propia tropa. Lo declaran en Ajustes. Mientras tanto, las
               viñas que pidan cargadores tendrán que resolverlo por su cuenta.
             </p>
           </div>`
        : estibas.map(e => {
            const ocupado = Store.envios().some(x =>
              x.cuadrillaEmail === e.email && x.estado !== 'entregado');
            return `
              <div class="card list-item">
                <div class="li-ic" style="background:rgba(25,118,210,.12);color:var(--info)">
                  ${e.estiba === 'cuadrilla' ? '👥' : '💪'}
                </div>
                <div class="li-body">
                  <div class="li-title">${Shell.escape(Store.nombreDeEstiba(e))}</div>
                  <div class="li-sub">
                    ${Store.esSoloCargador(e)
                      ? (e.estiba === 'cuadrilla' ? 'Cargador con tropa' : 'Cargador individual')
                      : 'Tropa de ' + Shell.escape(e.nombre) + ' (transportista)'}
                    · ${Store.personasDeEstiba(e)} persona(s)${e.comuna ? ' · ' + Shell.escape(e.comuna) : ''}
                  </div>
                  <div class="li-sub">${ocupado ? '🟠 Con un retiro en curso' : '🟢 Libre'}</div>
                </div>
                <button class="link-btn" data-llamar-estiba="${Shell.escape(e.email)}">Contactar</button>
              </div>`;
          }).join('');

      const statsHtml = stats.map(s => `
        <div class="card stat-card">
          <div class="chip-ic" style="background:${Shell.tinte(s.color)};color:${s.color}">${s.ic}</div>
          <div class="val">${s.val}</div>
          <div class="lbl">${s.lbl}</div>
          <div class="sub">${s.sub}</div>
        </div>`).join('');

      /* -------- Cargas recientes, juntas por productor --------
         Igual que en el panel del transportista, y por el mismo motivo:
         un viñatero que publicó cuatro cargas llenaba cuatro tarjetas
         seguidas y parecían cuatro productores distintos. Agrupadas se ve
         de una sola mirada cuánto ofrece cada uno en total, que es lo que
         decide si vale la pena mandar un camión.

         Se muestran los tres primeros productores, no las tres primeras
         cargas: antes, uno solo con tres publicaciones se comía la
         sección entera. */
      const grupos = Shell.agruparPorProductor(cargas).slice(0, 3);

      /* Una carga suelta dentro de la tarjeta de su productor. */
      function filaCarga(c) {
        const color = tipoColor(c.destino);
        return `
          <div class="carga-fila">
            <div class="li-ic" style="background:${Shell.tinte(color)};color:${color}">${tipoIcono(c.destino)}</div>
            <div class="carga-datos">
              <div class="carga-titulo">
                <b>${c.volumen} m³</b> · ${Shell.escape(c.comuna)}
                ${Shell.badge(c.destino, color)}
              </div>
              <div class="li-sub">📅 Disponible: ${Shell.escape(c.fecha || 'Por confirmar')}</div>
              ${Shell.avisoConsolidado(c)}
            </div>
          </div>`;
      }

      const recientesHtml = grupos.length === 0
        ? `<div class="empty"><div class="ic">🌾</div><p>Todavía no hay cargas publicadas</p></div>`
        : grupos.map((g, i) => {
            const varias = g.cargas.length > 1;
            return `
              <div class="card pad route-card">
                <div class="grupo-cabecera">
                  <div class="li-ic" style="background:${Shell.tinte('var(--primary)')};color:var(--primary)">🍇</div>
                  <div class="grupo-titulo">
                    <b>${Shell.escape(g.productor)}</b>
                    <span class="li-sub">
                      ${varias ? `${g.cargas.length} cargas · ` : ''}${g.volumen} m³ en total
                      · ${g.comunas.map(Shell.escape).join(', ')}
                    </span>
                  </div>
                  <button class="btn ghost" style="padding:10px 14px;font-size:13.5px"
                          data-i="${i}">📞 Contactar</button>
                </div>
                <div class="grupo-cargas">${g.cargas.map(filaCarga).join('')}</div>
              </div>`;
          }).join('');

      /* Los avisos salen de los retiros y las cargas de esta planta.
         Antes eran tres frases fijas de data.js: una carga de 31 m³ que
         no existía y un camión asignado el 29/08 que tampoco. */
      const alertasHtml = Avisos.html();

      document.getElementById('content').innerHTML = `
        <div>
          <div class="greet">Hola, ${Shell.escape(u.nombre)} 👋</div>
          <div class="greet-sub">${Shell.escape(u.tipo || 'Empresa')} · ${Shell.escape(u.comuna)} — Encuentra sarmientos disponibles para retirar</div>
        </div>

        <div class="grid cols-2" style="margin-top:20px">
          <button class="action-btn" style="background:var(--primary)" onclick="location.href='cargas.html'">
            <span class="ic">🌾</span><b>Ver Cargas Disponibles</b><span>Sarmientos publicados</span>
          </button>
          <button class="action-btn" style="background:var(--primary-dark)" onclick="location.href='mapa.html'">
            <span class="ic">🗺️</span><b>Mapa de Acopio</b><span>Plantas y centros</span>
          </button>
        </div>

        <div class="section">
          <div class="section-title">Mi flota</div>
          <div class="section-sub">
            ${flota.length
              ? flota.length + ' transportista(s) vinculado(s) a tu planta'
              : 'Nadie vinculado todavía'}
          </div>
          <div class="grid" style="margin-top:12px">${flotaHtml}</div>
        </div>

        <div class="section">
          <!-- Lo que esta planta lleva recibido. Se actualiza solo. -->
          <div id="aporte-inicio"></div>
        </div>

        <div class="section">
          <div class="section-title">Membresía y gastos</div>
          <div class="section-sub">${Finanzas.activa(u)
            ? 'Plan ' + Finanzas.plan(u).label + ' · quedan ' + Finanzas.diasRestantes(u) + ' día(s)'
            : 'Sin membresía activa'}</div>
          <div style="margin-top:12px">${Finanzas.walletHtml(u.email, { titulo: 'Gastos del período', positivo: false })}</div>
          <div style="margin-top:12px">${Finanzas.membresiaHtml(u)}</div>
        </div>

        <div class="section">
          <div class="section-title">Cargadores disponibles</div>
          <div class="section-sub">
            ${estibas.length
              ? estibas.length + ' equipo(s) de estiba · ' + personasTotales + ' persona(s) en total'
              : 'Ningún equipo de estiba disponible ahora mismo'}
          </div>
          <div class="grid" style="margin-top:12px">${estibasHtml}</div>
        </div>

        <div class="section">
          <div class="section-title">Resumen de la oferta</div>
          <div class="section-sub">Sarmientos disponibles en la Región del Maule</div>
          <div class="grid cols-4" style="margin-top:12px">${statsHtml}</div>
        </div>

        <div class="section">
          <div class="section-title">Últimas cargas publicadas</div>
          <div class="section-sub">
            ${grupos.length
              ? 'Agrupadas por productor · contacta directamente al viñatero'
              : 'Contacta directamente al viñatero'}
          </div>
          <div class="grid" style="margin-top:12px" id="recientes">${recientesHtml}</div>
          ${grupos.length ? `<div style="text-align:right;margin-top:10px">
            <button class="link-btn" onclick="location.href='cargas.html'">Ver todas las cargas ›</button>
          </div>` : ''}
        </div>

        <div class="section">
          <div class="section-title">Avisos</div>
          <div class="section-sub">Sobre tus retiros, las cargas nuevas y tu cuenta</div>
          <div class="grid" style="margin-top:12px">${alertasHtml}</div>
        </div>`;

      Finanzas.conectarMembresia(document.getElementById('content'));

      document.querySelectorAll('[data-llamar-estiba]').forEach(b => {
        b.onclick = () => {
          const e = Store.accountByEmail(b.dataset.llamarEstiba);
          if (!e) return;
          Shell.contactar(Store.nombreDeEstiba(e),
            `Estiba · ${Store.personasDeEstiba(e)} persona(s)`,
            { tel: e.telefono, email: e.email, ic: '👷' });
        };
      });

      // Desde la flota se entra al seguimiento del viaje en curso.
      document.querySelectorAll('[data-viaje]').forEach(el => {
        el.onclick = () => {
          location.href = 'seguimiento.html?id=' + encodeURIComponent(el.dataset.viaje);
        };
      });

      /* Contacto directo desde las tarjetas de cargas recientes. Ahora el
         índice es el del grupo, no el de una carga suelta: se llama al
         productor por todo lo que ofrece, que es de lo que hay que
         hablar con él. */
      document.querySelectorAll('#recientes button[data-i]').forEach(b => {
        b.onclick = () => {
          const g = grupos[+b.dataset.i];
          const detalle = g.cargas.length > 1
            ? `${g.cargas.length} cargas · ${g.volumen} m³ en ${g.comunas.join(', ')}`
            : `${g.comunas[0]} · ${g.volumen} m³ de sarmientos`;
          Shell.contactar(g.productor, detalle, {
            tel: g.telefono, email: g.email, ic: '🍇',
          });
        };
      });

      Avisos.montarCampana('btn-notif');

      /* Resumen de la próxima ruta. Vive en Inicio, Rutas e Historial con
         el mismo código: lo que muestra depende del perfil de quien mira. */
      Ficha.montarAporte(document.getElementById('aporte-inicio'));
      Ficha.montar(document.getElementById('proxima-ruta'));
    });
  </script>
</body>
</html>
