<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VITILOG · Mi viaje</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div class="tb-logo">🚚</div>
        <div><h1>Mi viaje</h1><p id="tb-sub">—</p></div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomnav"></nav>

  <script src="js/config.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vivo.js"></script>
  <script src="js/ruteo.js"></script>
  <script src="js/mosaico.js"></script>
  <script src="js/shell.js"></script>
  <script>
    Shell.init('viaje', { rol: Store.ROL_CHOFER }).then(listo => { if (!listo) return;
      const $ = id => document.getElementById(id);
      const c = $('content');
      let envio = Store.servicioActivo();
      let reloj = null;
      let ultimoAviso = null;

      if (!envio) {
        c.innerHTML = `
          <div class="empty">
            <div class="ic">🚚</div>
            <p>No tienes ningún viaje en curso.</p>
            <button class="btn" style="margin-top:14px" onclick="location.href='inicio-chofer.html'">
              Ver servicios disponibles
            </button>
          </div>`;
        return;
      }

      /* ---------------- Pantalla ---------------- */
      function render() {
        const seg = Shell.calcularSeguimiento(envio);
        const est = estadoEnvio(seg.estado);
        const arrancado = !!envio.salida;
        const transmitiendo = Shell.transmitiendo();
        const frescura = Shell.frescura(envio);
        const perdida = Shell.senalPerdida(envio);

        /* Consolidación de carga: cuánto lleva y cuánto le cabe todavía. */
        const yo = Store.currentUser();
        const capacidad = Number(yo && yo.capacidad) || 0;
        const cargado = (Number(envio.volumenDeclarado) || 0)
          + (envio.paradas || []).reduce((t, p) => t + (Number(p.volumen) || 0), 0);
        const libre = Store.capacidadRestante(envio, yo);

        $('tb-sub').textContent = `${envio.origenComuna} → ${envio.destinoNombre}`;

        c.innerHTML = `
          <!-- Estado del GPS: es lo más importante para el transportista -->
          <div class="card pad" style="border:2px solid ${transmitiendo ? 'var(--primary)' : 'var(--border)'}">
            <div class="envio-cabecera">
              <div class="li-ic" style="width:46px;height:46px;font-size:23px;
                   background:${transmitiendo ? 'rgba(46,125,50,.14)' : 'var(--surface-alt)'};
                   color:${transmitiendo ? 'var(--primary)' : 'var(--text-secondary)'}">
                ${transmitiendo ? '🛰️' : '📴'}
              </div>
              <div class="titulo">
                ${transmitiendo ? 'Transmitiendo ubicación' : 'Ubicación apagada'}
                <div class="li-sub" style="font-weight:400">
                  ${transmitiendo
                    ? (frescura ? 'Última señal ' + frescura : 'Buscando señal…')
                    : 'El viñatero no puede verte en el mapa'}
                </div>
              </div>
            </div>
            ${perdida && transmitiendo ? `
              <div class="aviso-error visible" style="margin-top:12px">
                <span aria-hidden="true">⚠️</span>
                <span>Hace más de 2 minutos que no llega señal. Revisa la cobertura.</span>
              </div>` : ''}
            <button class="btn block" style="margin-top:14px;background:${transmitiendo ? 'var(--danger)' : 'var(--primary)'}"
                    id="btn-gps">
              ${transmitiendo ? '⏹ Detener transmisión' : '🛰️ Comenzar a transmitir'}
            </button>
            <p class="section-sub" style="margin-top:9px;text-align:center">
              Se envía la posición cada 15 segundos o cada 120 metros, lo que ocurra después.
              Así se gasta menos batería y menos datos.
            </p>
          </div>

          <!-- Avance del viaje -->
          <div class="card pad" style="margin-top:14px">
            <div class="envio-cabecera">
              <div class="li-ic" style="background:${est.color}22;color:${est.color}">${est.ic}</div>
              <div class="titulo">${est.label}
                <div class="li-sub" style="font-weight:400">${est.desc}</div>
              </div>
              ${Shell.badge(seg.fuente === 'gps' ? 'Por GPS' : 'Estimada',
                            seg.fuente === 'gps' ? '#2E7D32' : '#5F6B60',
                            seg.fuente === 'gps' ? '🛰️' : '📈')}
            </div>
            <div class="progress" style="margin-top:14px">
              <div style="width:${Math.round(seg.progreso*100)}%;background:${est.color}"></div>
            </div>
            <div class="grid cols-3" style="margin-top:16px">
              <div>
                <div class="dato-grande">${seg.kmRestantes} km</div>
                <div class="dato-rotulo">Faltan</div>
              </div>
              <div>
                <div class="dato-grande">${cargado} m³</div>
                <div class="dato-rotulo">${(envio.paradas||[]).length ? 'Carga total' : 'Carga declarada'}</div>
              </div>
              <div>
                <div class="dato-grande" style="color:${est.color}">${seg.eta || '—'}</div>
                <div class="dato-rotulo">Llegada estimada</div>
              </div>
            </div>
          </div>

          <!-- Mapa -->
          <div class="section">
            <div class="section-title">Recorrido</div>
            <div class="map-sim map-propio map-ruta" id="mapa-ruta" style="margin-top:12px"></div>
          </div>

          <!-- Paradas ya aceptadas en este viaje -->
          ${(envio.paradas || []).length ? `
            <div class="section">
              <div class="section-title">Paradas de este viaje</div>
              <div class="section-sub">En el orden que conviene hacerlas</div>
            </div>
            <div class="grid" style="margin-top:12px">
              ${envio.paradas.map((p, i) => `
                <div class="card list-item">
                  <div class="li-ic" style="background:${p.recogida ? 'rgba(46,125,50,.14)' : 'rgba(25,118,210,.12)'};color:${p.recogida ? 'var(--primary)' : 'var(--info)'}">${p.recogida ? '✅' : (i+1)}</div>
                  <div class="li-body">
                    <div class="li-title">${Shell.escape(p.comuna)} · ${p.volumen} m³</div>
                    <div class="li-sub">${Shell.escape(p.productor || 'Productor VITILOG')}</div>
                  </div>
                  ${p.recogida ? '' : `<button class="link-btn" data-recogida="${Shell.escape(p.cargaId)}">Ya cargué</button>`}
                </div>`).join('')}
            </div>` : ''}

          <!-- Consolidación: cargas que caben y quedan de paso -->
          <div class="section">
            <div class="section-title">Aprovechar el viaje</div>
            <div class="section-sub">
              Te quedan <b>${libre} m³</b> libres de ${capacidad || '?'} m³
            </div>
          </div>
          <div id="consolidar" style="margin-top:12px">
            ${libre <= 0
              ? `<div class="empty"><div class="ic">📦</div><p>El camión va lleno.</p></div>`
              : `<div class="section-sub">Buscando cargas que te queden de paso…</div>`}
          </div>

          <!-- Acción principal según el momento del viaje -->
          <div class="section">
            ${!arrancado ? `
              <button class="btn block" id="btn-salir" style="min-height:56px;font-size:17px">
                ▶ Iniciar viaje
              </button>
              <p class="section-sub" style="margin-top:9px;text-align:center">
                Al iniciar, el viñatero empieza a verte en su mapa.
              </p>`
            : seg.estado === 'en_destino' ? `
              <button class="btn block" id="btn-llegue" style="min-height:56px;font-size:17px;background:var(--primary)">
                📍 Avisar que llegué
              </button>`
            : `<button class="btn ghost block" id="btn-llegue">📍 Ya llegué a destino</button>`}
          </div>

          <!-- Contacto y chat -->
          <div class="section">
            <div class="section-title">Productor</div>
            <div class="card list-item" style="margin-top:12px">
              <div class="li-ic" style="background:rgba(46,125,50,.12);color:var(--primary)">🍇</div>
              <div class="li-body">
                <div class="li-title">${Shell.escape(nombreProductor())}</div>
                <div class="li-sub">${Shell.escape(envio.origenComuna)}</div>
              </div>
              <button class="btn ghost" style="padding:10px 14px;font-size:13.5px" id="btn-contacto">💬 Contactar</button>
            </div>
            <button class="btn ghost block" style="margin-top:10px"
                    onclick="location.href='seguimiento.html?id=${encodeURIComponent(envio.id)}'">
              💬 Abrir chat y cierre de entrega
            </button>
          </div>`;

        pintarMapa(seg);
        conectar(seg);
      }

      function nombreProductor() {
        const v = Store.accountByEmail(envio.vinateroEmail);
        return v ? v.nombre : 'Productor VITILOG';
      }

      function pintarMapa(seg) {
        const mapa = $('mapa-ruta');
        Shell.pintarMapas();
        Shell.dibujarMarcadores(mapa, [], {});
        Shell.encuadrarRuta(mapa.querySelector('.map-geo'), envio, seg);
        Shell.dibujarRuta(mapa, envio, seg);

        /* El camino real llega del servicio de ruteo, que tarda un momento.
           Cuando llega, se vuelve a dibujar con la carretera de verdad en
           lugar de la línea recta. */
        Shell.rutaDelEnvio(envio).then(cambio => { if (cambio) render(); });
      }

      function conectar(seg) {
        $('btn-gps').onclick = () => Shell.transmitiendo() ? apagarGps() : encenderGps();

        document.querySelectorAll('[data-recogida]').forEach(b => {
          b.onclick = async () => {
            b.disabled = true;
            await Store.marcarParadaRecogida(envio.id, b.dataset.recogida);
            envio = Store.envioPorId(envio.id) || envio;
            Shell.toast('Parada marcada como cargada');
            render();
          };
        });

        buscarDePaso(seg);

        const salir = $('btn-salir');
        if (salir) salir.onclick = async () => {
          envio = await Store.actualizarEnvio(envio.id, {
            estado: 'en_camino', salida: new Date().toISOString(),
          });
          Shell.notificar('Viaje iniciado', `${envio.origenComuna} → ${envio.destinoNombre}`);
          encenderGps();          // transmitir es el comportamiento esperado
          render();
        };

        const llegue = $('btn-llegue');
        if (llegue) llegue.onclick = async () => {
          envio = await Store.actualizarEnvio(envio.id, { estado: 'en_destino', progreso: 1 });
          apagarGps();
          Shell.notificar('Llegada registrada', 'El productor ya puede confirmar la entrega');
          location.href = 'seguimiento.html?id=' + encodeURIComponent(envio.id);
        };

        $('btn-contacto').onclick = () => {
          const v = Store.accountByEmail(envio.vinateroEmail);
          Shell.contactar(nombreProductor(), envio.origenComuna,
            { tel: v ? v.telefono : '', email: envio.vinateroEmail, ic: '🍇' });
        };
      }

      /* ---------------- Consolidación de carga ----------------
         Busca cargas libres que quepan en lo que queda del camión y que no
         obliguen a dar un rodeo largo. El criterio es cuánto se alarga el
         viaje si se suma esa parada, no la distancia en línea recta: una
         viña puede estar cerca y quedar al otro lado del río. */
      async function buscarDePaso(seg) {
        const caja = $('consolidar');
        if (!caja) return;

        const yo = Store.currentUser();
        const libre = Store.capacidadRestante(envio, yo);
        if (libre <= 0) return;

        const candidatas = Store.cargasQueCaben(envio, yo)
          .filter(c => c.lat != null && c.lng != null);
        if (candidatas.length === 0) {
          caja.innerHTML = `<div class="empty"><div class="ic">🌾</div>
            <p>No hay cargas libres que te quepan ahora.</p></div>`;
          return;
        }

        const desde = seg.posicion;
        const destino = { lat: envio.destinoLat, lng: envio.destinoLng };
        const directo = (envio.kmRuta != null)
          ? envio.kmRuta : (Shell.distanciaKm(desde, destino) || 0);

        /* Una sola consulta para todas: desde dónde va el camión a cada
           viña, y de cada viña a la planta. */
        const m = await Ruteo.matriz([desde, ...candidatas, destino]);
        const ultimo = candidatas.length + 1;

        const conRodeo = candidatas.map((c, i) => {
          const ida = m ? m.km[0][i + 1] : Shell.distanciaKm(desde, c);
          const resto = m ? m.km[i + 1][ultimo] : Shell.distanciaKm(c, destino);
          const total = (ida ?? 0) + (resto ?? 0);
          return { ...c, ida, total, rodeo: Math.round((total - directo) * 10) / 10 };
        })
          .filter(c => c.rodeo <= 35)       // más de 35 km de rodeo no compensa
          .sort((a, b) => a.rodeo - b.rodeo)
          .slice(0, 5);

        if (conRodeo.length === 0) {
          caja.innerHTML = `<div class="empty"><div class="ic">🛣️</div>
            <p>Las cargas libres te quedan muy desviadas del camino.</p></div>`;
          return;
        }

        caja.innerHTML = `<div class="grid">${conRodeo.map((c, i) => `
          <div class="card list-item">
            <div class="li-ic" style="background:rgba(249,168,37,.14);color:var(--warning)">🌾</div>
            <div class="li-body">
              <div class="li-title">${Shell.escape(c.comuna)} · ${c.volumen} m³</div>
              <div class="li-sub">${Shell.escape(c.productor)}</div>
              <div class="li-sub">
                ${c.rodeo <= 0 ? 'Te queda justo de paso' : '+' + c.rodeo + ' km de rodeo'}
                ${m && m.real ? '' : ' (estimado)'}
              </div>
            </div>
            <button class="btn" style="padding:10px 14px;font-size:13.5px"
                    data-sumar="${i}">+ Sumar</button>
          </div>`).join('')}</div>`;

        caja.querySelectorAll('[data-sumar]').forEach(b => {
          b.onclick = async () => {
            const carga = conRodeo[+b.dataset.sumar];
            b.disabled = true;
            b.textContent = 'Calculando…';

            /* Con la parada nueva se recalcula el orden de TODAS las paradas:
               sumar una al final casi nunca es lo más corto. */
            const paradas = (envio.paradas || []).concat([carga]);
            const opt = await Ruteo.optimizar(
              seg.posicion,
              paradas.map(p => ({ lat: p.lat, lng: p.lng })),
              { lat: envio.destinoLat, lng: envio.destinoLng });

            const error = await Store.agregarParada(envio.id, carga, {
              orden: opt && opt.orden,
              minutos: opt && opt.minutos,
            });
            if (error) { b.disabled = false; b.textContent = '+ Sumar'; return Shell.toast(error); }

            envio = Store.envioPorId(envio.id) || envio;
            envio.geometria = null;          // la ruta cambió: se vuelve a pedir
            Shell.toast(`Parada sumada · ${opt ? opt.km + ' km en total' : ''}`);
            render();
          };
        });
      }

      /* ---------------- GPS ---------------- */
      function encenderGps() {
        if (!Shell.puedePedirGPS()) {
          Shell.toast(Shell.motivoGPS(new Error('sin-origen-seguro')));
          return;
        }
        const ok = Shell.iniciarTransmision(envio.id, {
          alActualizar: async () => {
            envio = Store.envioPorId(envio.id) || envio;
            render();
          },
          alFallar: err => {
            const msg = Shell.motivoGPS(err);
            if (msg !== ultimoAviso) { Shell.toast(msg); ultimoAviso = msg; }
          },
        });
        if (ok) { Shell.toast('Transmitiendo tu ubicación'); render(); }
      }

      function apagarGps() {
        Shell.detenerTransmision();
        Shell.toast('Transmisión detenida');
        render();
      }

      /* Refresco suave: recalcula estado y frescura de la señal. */
      async function tic() {
        const fresco = Store.envioPorId(envio.id);
        if (fresco) envio = fresco;
        const { seguimiento } = await Shell.sincronizarEnvio(envio);
        envio = Store.envioPorId(envio.id) || envio;
        render();
        if (seguimiento.estado === 'entregado') {
          apagarGps();
          clearInterval(reloj);
        }
      }

      Shell.pedirPermisoNotificaciones();
      render();

      /* Si se llega acá recién aceptando un retiro, la transmisión arranca
         sola: aceptar ya fue la decisión del transportista y no tiene sentido
         pedirle un segundo toque con el camión partiendo. El navegador igual
         pedirá permiso de ubicación la primera vez, y se puede apagar en
         cualquier momento desde el botón de arriba. */
      if (new URLSearchParams(location.search).get('iniciar') === '1'
        && !Shell.transmitiendo()) {
        encenderGps();
        history.replaceState(null, '', 'viaje.html');
      }

      reloj = setInterval(tic, 10000);
      window.addEventListener('beforeunload', () => {
        Shell.detenerTransmision();
        clearInterval(reloj);
      });
    });
  </script>
</body>
</html>
